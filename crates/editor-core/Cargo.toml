[package]
name = "editor-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[features]
test-support = []

[dependencies]
aqua = { workspace = true }
artisan-api = { path = "../artisan-api", features = ["tls"] }
artisan-account = { path = "../artisan-account" }
artisan-paths = { path = "../artisan-paths" }
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
url.workspace = true
ropey.workspace = true
base64.workspace = true
tempfile.workspace = true
sse-core.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "zstd"] }
claude-ai-browser = { path = "../claude-ai-browser" }

[dev-dependencies]
editor-core = { path = ".", features = ["test-support"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
str_to_string = "deny"
missing_assert_message = "deny"
unwrap_in_result = "deny"
collapsible_if = "allow"
collapsible_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
useless_conversion = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
manual_clamp = "allow"
manual_flatten = "allow"
unnecessary_fold = "allow"
unnecessary_unwrap = "allow"
unnecessary_to_owned = "allow"
unnecessary_result_map_or_else = "allow"
let_and_return = "allow"
derivable_impls = "allow"
clone_on_copy = "allow"
arc_with_non_send_sync = "allow"
rc_buffer = "allow"
