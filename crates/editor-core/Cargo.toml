[package]
name = "editor-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
test = false
doctest = false

[features]
test-support = []

[dependencies]
aqua = { workspace = true }
artisan-api = { workspace = true, features = ["tls"] }
artisan-account.workspace = true
artisan-paths.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
url.workspace = true
ropey.workspace = true
base64.workspace = true
tempfile.workspace = true
sse-core.workspace = true
tokio-util.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "zstd"] }
claude-ai-browser.workspace = true

[dev-dependencies]
editor-core = { path = ".", features = ["test-support"] }

[lints]
workspace = true
