[package]
name = "editor-core"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "The Editor's Forge client: hosts, pairing, the connection to each Forge, the store of what Forge sent, and navigation."

[dependencies]
ropey.workspace = true
tempfile.workspace = true
anyhow.workspace = true
artisan-api = { path = "../artisan-api", features = ["tls"] }
claude-ai-browser = { path = "../claude-ai-browser" }
artisan-paths = { path = "../artisan-paths" }
futures.workspace = true
gpui.workspace = true
editor-ui = { path = "../editor-ui" }
reqwest = { workspace = true, features = ["json", "stream", "zstd"] }
artisan-account = { path = "../artisan-account" }
tokio-tungstenite = { workspace = true }
serde.workspace = true
serde_json.workspace = true
base64.workspace = true
sse-core.workspace = true
tokio-util.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
forge-http = { path = "../forge-http" }
forge-store = { path = "../forge-store" }
gpui = { workspace = true, features = ["test-support"] }

[features]
# Test-only inventory helpers (`Core::for_tests`, `Core::add_test_host`)
# for unrelated component tests. Production builds never enable this;
# native entry/gate tests use the real `Core::new` plus HTTP fixtures.
test-support = []

[lints]
workspace = true
