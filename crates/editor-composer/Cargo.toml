[package]
name = "editor-composer"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Draft, attachments (converted to WebP), model picker, send / steer / cancel."

[dependencies]
anyhow.workspace = true
artisan-api = { path = "../artisan-api" }
artisan-mentions = { path = "../artisan-mentions" }
editor-ui = { path = "../editor-ui" }
editor-core = { path = "../editor-core" }
editor-sources = { path = "../editor-sources" }
gpui.workspace = true
futures.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp", "bmp"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
webp.workspace = true

[dev-dependencies]
forge-engines = { path = "../forge-engines" }
forge-http = { path = "../forge-http" }
forge-store = { path = "../forge-store" }
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time", "macros"] }
tokio-util.workspace = true

[lints]
workspace = true
