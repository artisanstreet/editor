[package]
name = "editor-composer"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
doctest = false

[features]
test-support = ["editor-core/test-support", "editor-ui/test-support"]

[dependencies]
aqua = { workspace = true }
aqua-core = { workspace = true }
aqua-media = { workspace = true }
aqua-text = { workspace = true }
aqua-ui = { workspace = true }
artisan-api = { workspace = true, features = ["tls"] }
artisan-mentions.workspace = true
editor-assets.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
tokio-util.workspace = true
thiserror.workspace = true
diagnostics.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
webp.workspace = true
editor-core.workspace = true
editor-ui.workspace = true

[dev-dependencies]
editor-composer = { path = ".", features = ["test-support"] }

[lints]
workspace = true
