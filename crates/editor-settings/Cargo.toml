[package]
name = "editor-settings"
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Preferences, engines, skills and MCP servers, hosts and devices."

[dependencies]
anyhow.workspace = true
artisan-api = { path = "../artisan-api" }
editor-ui = { path = "../editor-ui" }
editor-core = { path = "../editor-core" }
# The profiler backs the FPS overlay, as in the previous Editor.
gpui = { workspace = true, features = ["profiler"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
artisan-api = { path = "../artisan-api", features = ["tls"] }
forge-http = { path = "../forge-http" }
forge-store = { path = "../forge-store" }
gpui = { workspace = true, features = ["profiler", "test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
