[package]
name = "editor-settings"
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Preferences, engines, skills and MCP servers, hosts and devices."

[dependencies]
claude-ai-browser = { path = "../claude-ai-browser" }
anyhow.workspace = true
artisan-api = { path = "../artisan-api" }
editor-ui = { path = "../editor-ui" }
editor-core = { path = "../editor-core" }
# The frame overlay does not need task tracing or profiler history.
gpui = { workspace = true, features = ["frame-rate"] }
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
artisan-api = { path = "../artisan-api", features = ["tls"] }
forge-http = { path = "../forge-http" }
forge-store = { path = "../forge-store" }
gpui = { workspace = true, features = ["frame-rate", "test-support"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
