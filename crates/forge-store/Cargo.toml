[package]
name = "forge-store"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Forge's durable state: one SQLite file with a global change seq, plus content-addressed blobs."

[lib]
doctest = false

[features]
qualification = []
test-support = []

[dependencies]
artisan-markdown-index.workspace = true
tempfile.workspace = true
fs2.workspace = true
artisan-api.workspace = true
artisan-paths.workspace = true
forge-content.workspace = true
image = { workspace = true, features = ["gif", "jpeg", "png", "webp"] }
rusqlite = { workspace = true, features = ["fallible_uint"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
regex.workspace = true
tokio = { workspace = true, features = ["sync", "rt"] }
tracing.workspace = true
thiserror.workspace = true
webp.workspace = true
fff-grep = "=0.9.6"
memchr = "2.8.3"
notify.workspace = true

[dev-dependencies]
divan.workspace = true
test-support.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }

[[bench]]
name = "recall"
harness = false

[[bench]]
name = "text_search"
harness = false

[[bench]]
name = "retention"
harness = false

[[bench]]
name = "content"
harness = false

[[bench]]
name = "transcript"
harness = false

[lints]
workspace = true
