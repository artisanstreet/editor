[package]
name = "forge-http"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Forge's HTTPS API: mutual-TLS auth, JSON routes and the event stream."
# tests/ holds path-included unit tests (see src `#[path]`), not integration targets.
autotests = false

[lib]
doctest = false

[[example]]
name = "replay_engine"
path = "../forge-engines/tests/fakes/engine/main.rs"

[dependencies]
dirs.workspace = true
artisan-account.workspace = true
artisan-api = { workspace = true, features = ["tls"] }
axum = { workspace = true }
base64.workspace = true
diagnostics.workspace = true
forge-engines.workspace = true
forge-computer.workspace = true
forge-mcp.workspace = true
forge-runs.workspace = true
forge-store.workspace = true
fs2.workspace = true
futures.workspace = true
gethostname.workspace = true
getrandom.workspace = true
hex.workspace = true
tempfile.workspace = true
hyper = { workspace = true, features = ["server", "http1", "http2"] }
hyper-util = { workspace = true, features = ["server", "server-auto", "http1", "http2", "service", "tokio"] }
reqwest = { workspace = true, features = ["stream", "json"] }
rustls.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokio = { workspace = true, features = ["net", "sync", "rt", "macros", "time", "fs", "io-util", "process"] }
tokio-rustls = { workspace = true }
tokio-tungstenite = { workspace = true }
tokio-util.workspace = true
tower = { workspace = true }
tower-http = { workspace = true, features = ["compression-zstd"] }
thiserror.workspace = true
tracing.workspace = true
url.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["process"] }

[dev-dependencies]
rusqlite.workspace = true
test-support = { workspace = true, features = ["http", "sse", "transcript"] }
reqwest = { workspace = true, features = ["json", "zstd"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util"] }
ed25519-dalek.workspace = true
webp.workspace = true

[[test]]
name = "budgets"
path = "tests/budgets.rs"

[lints]
workspace = true
