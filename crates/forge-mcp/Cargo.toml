[package]
name = "forge-mcp"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "The Artisan MCP: what an agent can do with Artisan, served to every engine through Forge's gateway."

[lib]
doctest = false

[dependencies]
artisan-api.workspace = true
diagnostics.workspace = true
forge-runs.workspace = true
forge-store.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "time"] }
tracing.workspace = true
url.workspace = true

[dev-dependencies]
divan.workspace = true
forge-engines.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[[bench]]
name = "transcript"
harness = false

[lints]
workspace = true
