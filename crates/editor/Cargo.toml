[package]
name = "editor"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "The Artisan Editor window: layout, titlebar, command palette, notices, pairing."
autotests = false

[[bin]]
name = "artisan-editor"
path = "src/main.rs"

[features]
windows-wgpu = ["gpui_platform/wgpu"]
capture = ["gpui/test-support", "gpui_platform/test-support", "dep:image", "editor-aqua/capture"]
dhat-heap = ["dep:dhat"]
qualification = ["editor-aqua/qualification"]

[dependencies]
anyhow.workspace = true

[target.'cfg(windows)'.dependencies]
editor-aqua = { path = "../editor-aqua" }

[target.'cfg(not(windows))'.dependencies]
image = { workspace = true, features = ["png"], optional = true }
dhat = { workspace = true, optional = true }
artisan-api = { path = "../artisan-api" }
editor-ui = { path = "../editor-ui" }
editor-composer = { path = "../editor-composer" }
editor-conversation = { path = "../editor-conversation" }
editor-core = { path = "../editor-core" }
editor-sources = { path = "../editor-sources" }
editor-inspector = { path = "../editor-inspector" }
editor-marketplace = { path = "../editor-marketplace" }
editor-settings = { path = "../editor-settings" }
editor-sidebar = { path = "../editor-sidebar" }
gpui.workspace = true
futures.workspace = true
gpui_platform.workspace = true
serde_json.workspace = true
tracing.workspace = true
file-rotate = "0.8.0"
tracing-subscriber = { workspace = true, features = ["env-filter", "fmt"] }

[target.'cfg(not(windows))'.dev-dependencies]
editor-core = { path = "../editor-core", features = ["test-support"] }
tempfile.workspace = true

[lints]
workspace = true

[build-dependencies]
embed-resource = "=3.0.11"
