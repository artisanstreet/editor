[package]
name = "forge-runs"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Live runs: start, steer, answer and cancel engine runs, and turn engine events into stored items."

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
artisan-api.workspace = true
forge-content.workspace = true
forge-engines.workspace = true
forge-store.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
url.workspace = true
tokio-util.workspace = true
getrandom.workspace = true
hex.workspace = true
tracing.workspace = true
dirs.workspace = true
pulldown-cmark.workspace = true
thiserror.workspace = true

[dev-dependencies]
futures.workspace = true
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
