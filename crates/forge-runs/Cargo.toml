[package]
name = "forge-runs"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Live runs: start, steer, answer and cancel engine runs, and turn engine events into stored items."

[lib]
doctest = false

[dependencies]
artisan-api.workspace = true
diagnostics.workspace = true
forge-content.workspace = true
forge-engines.workspace = true
forge-store.workspace = true
fs2.workspace = true
serde.workspace = true
serde_json.workspace = true
reqwest = { workspace = true, features = ["json", "stream"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "rt", "macros", "time", "net"] }
url.workspace = true
tokio-util.workspace = true
getrandom.workspace = true
hex.workspace = true
tracing.workspace = true
dirs.workspace = true
pulldown-cmark.workspace = true
sha2.workspace = true
uuid.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
axum.workspace = true
futures.workspace = true
rusqlite.workspace = true
test-support = { workspace = true, features = ["tokio", "http"] }
image = { workspace = true, features = ["png"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
