[package]
name = "forge-engines"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Engine adapters: run Claude, Codex, OpenCode, Grok and Cursor and map their wiring onto artisan-api items."

[lib]
doctest = false

[features]
default = []

[dependencies]
anyhow.workspace = true
artisan-api.workspace = true
artisan-paths.workspace = true
artisan-mentions.workspace = true
forge-content.workspace = true
forge-isolation.workspace = true
base64.workspace = true
chrono.workspace = true
vte.workspace = true
flate2.workspace = true
fs2.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
regex.workspace = true
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
getrandom.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
url.workspace = true
serde_yaml_ng = "=0.10.0"
walkdir = "=2.5.0"
ignore = "=0.4.33"
globset = "=0.4.20"
encoding_rs = "=0.8.35"
sse-core.workspace = true
sha2.workspace = true
hex.workspace = true
similar.workspace = true
shlex = "=2.0.1"
semver.workspace = true
toml.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "macros", "rt", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }

[dev-dependencies]
axum.workspace = true
insta.workspace = true
test-support = { workspace = true, features = ["http"] }
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net"] }

[lints]
workspace = true
