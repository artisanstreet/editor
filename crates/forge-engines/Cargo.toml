[package]
name = "forge-engines"
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "Engine adapters: run Claude, Codex, OpenCode, Grok and Cursor and map their wiring onto artisan-api items."

[features]
default = []
legacy-import = []

[dependencies]
anyhow.workspace = true
artisan-api = { path = "../artisan-api" }
artisan-mentions = { path = "../artisan-mentions" }
forge-content = { path = "../forge-content" }
base64.workspace = true
chrono.workspace = true
vte.workspace = true
flate2.workspace = true
fs2.workspace = true
futures.workspace = true
pulldown-cmark.workspace = true
process-wrap = { version = "=10.0.1", default-features = false, features = ["tokio1", "process-group", "job-object", "kill-on-drop"] }
getrandom.workspace = true
reqwest = { workspace = true, features = ["stream"] }
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "=0.10.0"
walkdir = "=2.5.0"
sse-core.workspace = true
sha2.workspace = true
hex.workspace = true
similar.workspace = true
shlex = "=2.0.1"
semver = "=1.0.28"
toml.workspace = true
tar.workspace = true
tokio = { workspace = true, features = ["process", "io-util", "sync", "macros", "rt", "time", "fs"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "test-util", "net"] }

[lints]
workspace = true
