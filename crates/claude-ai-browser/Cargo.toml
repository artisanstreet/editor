[package]
name = "claude-ai-browser"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Signs in to claude.ai in the user's own browser and reads the session Native Claude Mode runs on."

[dependencies]
anyhow.workspace = true
artisan-api = { path = "../artisan-api" }
artisan-paths = { path = "../artisan-paths" }
futures.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time", "fs", "macros", "rt", "net"] }
tokio-tungstenite.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "net", "macros"] }

[lints]
workspace = true
