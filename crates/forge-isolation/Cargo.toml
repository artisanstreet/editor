[package]
name = "forge-isolation"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Keeps Forge responsive while engines saturate the machine: cgroups on Linux, process priorities on Windows, I/O policy on macOS."

[lib]
test = false
doctest = false

[dependencies]
tracing.workspace = true

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs", "process"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }

[lints]
workspace = true
