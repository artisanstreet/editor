[package]
name = "ae"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Installs and manages Artisan's apps (Forge, the Editor) and Forge's devices and engines."

[[bin]]
name = "ae"
path = "src/main.rs"
# Integration tests also exercise the real CLI binary.
test = true

[dependencies]
artisan-account.workspace = true
artisan-api.workspace = true
artisan-paths.workspace = true
artisan-payload.workspace = true
base64.workspace = true
clap.workspace = true
cliclack = "=0.5.6"
diagnostics.workspace = true
ed25519-dalek.workspace = true
forge-engines.workspace = true
forge-runs.workspace = true
claude-ai-browser.workspace = true
forge-http.workspace = true
forge-store.workspace = true
gethostname.workspace = true
reqwest.workspace = true
rusqlite.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
hex.workspace = true
semver.workspace = true
sysinfo = "=0.31.4"
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal"] }
thiserror.workspace = true
tracing.workspace = true

[build-dependencies]
artisan-payload.workspace = true
build-info.workspace = true

[dev-dependencies]
artisan-api = { workspace = true, features = ["tls"] }
flate2.workspace = true
axum.workspace = true
futures.workspace = true
base64.workspace = true
ed25519-dalek.workspace = true
forge-http.workspace = true
forge-runs.workspace = true
serde_json.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["json"] }
tempfile.workspace = true
test-support = { workspace = true, features = ["net", "http"] }
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
