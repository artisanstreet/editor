[package]
name = "editor-audio"
edition.workspace = true
license-file.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
rodio.workspace = true
crossbeam-channel.workspace = true

# Linux and the BSDs talk to PulseAudio (or PipeWire's pulse server) natively,
# so no ALSA headers or system libraries are needed to build.
[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
futures.workspace = true
pulseaudio.workspace = true

[target.'cfg(not(all(unix, not(target_os = "macos"))))'.dependencies]
cpal.workspace = true

[lints]
workspace = true
