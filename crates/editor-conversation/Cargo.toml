[package]
name = "editor-conversation"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[lib]
doctest = false

[features]
qualification = ["test-support"]
test-support = ["editor-ui/test-support", "editor-sources/test-support", "editor-composer/test-support"]

[dependencies]
aqua = { workspace = true }
aqua-core = { workspace = true }
aqua-text = { workspace = true }
aqua-ui = { workspace = true }
artisan-api = { workspace = true, features = ["tls"] }
artisan-mentions.workspace = true
editor-assets.workspace = true
thiserror.workspace = true
diagnostics.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
ropey.workspace = true
tokio = { workspace = true, features = ["time"] }
tokio-util.workspace = true
editor-core.workspace = true
editor-ui.workspace = true
editor-sources.workspace = true
editor-composer.workspace = true

[dev-dependencies]
axum.workspace = true
divan.workspace = true
tempfile.workspace = true
editor-conversation = { path = ".", features = ["test-support"] }
test-support = { workspace = true, features = ["clock", "editor-core"] }

[[bench]]
name = "fold"
harness = false

[lints]
workspace = true
