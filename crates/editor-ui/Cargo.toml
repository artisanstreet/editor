[package]
name = "editor-ui"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
artisan-markdown-index = { path = "../artisan-markdown-index" }
unicode-bidi = "0.3.18"
ropey.workspace = true
glam.workspace = true
color.workspace = true
chrono.workspace = true
url.workspace = true
data-url.workspace = true
vte.workspace = true
unicode-width.workspace = true
artisan-api = { path = "../artisan-api" }
futures.workspace = true
tokio = { workspace = true, features = ["sync"] }
editor-assets = { path = "../editor-assets" }
editor-audio = { path = "../editor-audio" }
base64.workspace = true
gpui.workspace = true
image = { version = "=0.25.10", default-features = false } # workspace-absent
gltf.workspace = true
ufbx.workspace = true
stl_io.workspace = true
ply-rs-bw.workspace = true
mermaid-rs-renderer.workspace = true
pulldown-cmark.workspace = true
serde.workspace = true
serde_json.workspace = true
syntect.workspace = true
thiserror.workspace = true
unicode-segmentation.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_Globalization"] }

# The workspace forbids unsafe code; `local_time` calls the Win32 locale
# formatters and allows it in that one module, so this crate denies it
# instead. The clippy lints are the workspace's.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
unwrap_in_result = "deny"
map_err_ignore = "deny"

[dev-dependencies]
tempfile.workspace = true
gpui_platform.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] }
gpui = { workspace = true, features = ["test-support"] }
