[package]
name = "editor-ui"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[lib]
doctest = false

[features]
test-support = ["editor-core/test-support"]

[dependencies]
aqua = { workspace = true }
aqua-core = { workspace = true }
aqua-protocol = { workspace = true }
aqua-text = { workspace = true }
aqua-ui = { workspace = true }
aqua-reactive = { workspace = true }
aqua-media = { workspace = true }
artisan-api = { workspace = true, features = ["tls"] }
artisan-mentions.workspace = true
artisan-markdown-index.workspace = true
editor-assets.workspace = true
editor-audio.workspace = true
palette.workspace = true
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
url.workspace = true
color.workspace = true
base64.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
pulldown-cmark.workspace = true
syntect.workspace = true
thiserror.workspace = true
mermaid-rs-renderer.workspace = true
usvg = { version = "0.48.1", default-features = false, features = ["text"] }
vte.workspace = true
unicode-width.workspace = true
ufbx.workspace = true
stl_io.workspace = true
ply-rs-bw.workspace = true
gltf.workspace = true
glam.workspace = true
chrono = { workspace = true, features = ["clock"] }
data-url.workspace = true
editor-core.workspace = true

[dev-dependencies]
editor-ui = { path = ".", features = ["test-support"] }

[lints]
workspace = true
