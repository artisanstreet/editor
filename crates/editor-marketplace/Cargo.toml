[package]
name = "editor-marketplace"
edition.workspace = true
license-file.workspace = true
version.workspace = true
description = "The Marketplace: search the active host's skills and MCP servers."

[dependencies]
artisan-api = { path = "../artisan-api" }
editor-ui = { path = "../editor-ui" }
editor-core = { path = "../editor-core" }
gpui.workspace = true
serde_json.workspace = true

[dev-dependencies]
artisan-api = { path = "../artisan-api", features = ["tls"] }
editor-core = { path = "../editor-core", features = ["test-support"] }
forge-http = { path = "../forge-http" }
forge-store = { path = "../forge-store" }
gpui = { workspace = true, features = ["test-support"] }
serde_json.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread"] }

[lints]
workspace = true
