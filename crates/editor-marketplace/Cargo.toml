[package]
name = "editor-marketplace"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true

[lib]
test = false
doctest = false

[features]
test-support = ["editor-core/test-support", "editor-ui/test-support"]

[dependencies]
aqua = { workspace = true }
aqua-core = { workspace = true }
aqua-text = { workspace = true }
aqua-ui = { workspace = true }
artisan-api = { workspace = true, features = ["tls"] }
editor-assets.workspace = true
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tokio-util.workspace = true
editor-core.workspace = true
editor-ui.workspace = true

[lints]
workspace = true
