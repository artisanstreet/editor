[package]
name = "forge-computer"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "Computer use: an MCP server that lets agents see and drive a virtual display, served to every engine through Forge's gateway."

[lib]
doctest = false

[dependencies]
anyhow.workspace = true
artisan-api.workspace = true
base64.workspace = true
diagnostics.workspace = true
forge-mcp.workspace = true
forge-runs.workspace = true
png = "=0.18.1"
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tracing.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_System_DataExchange",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
forge-store.workspace = true
forge-engines.workspace = true
tempfile.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
