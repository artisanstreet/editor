[package]
name = "editor-aqua"
edition.workspace = true
license.workspace = true
publish = false
version.workspace = true
description = "The native Windows Artisan Editor, built with Aqua"
build = "build.rs"
autotests = true

[lib]
doctest = false

[features]
test-support = ["editor-core/test-support", "editor-ui/test-support", "editor-sources/test-support", "editor-composer/test-support", "editor-conversation/test-support", "editor-sidebar/test-support", "editor-inspector/test-support", "editor-settings/test-support", "editor-marketplace/test-support"]
qualification = ["editor-conversation/qualification", "test-support", "dep:forge-http", "dep:forge-store", "forge-store/qualification", "dep:rusqlite", "dep:sha2", "dep:hex"]
capture = ["qualification", "dep:aqua-gpu-d3d11", "dep:aqua-gpu-ref", "dep:aqua-runtime"]

[dependencies]
editor-core.workspace = true
editor-ui.workspace = true
editor-sources.workspace = true
editor-composer.workspace = true
editor-conversation.workspace = true
editor-sidebar.workspace = true
editor-inspector.workspace = true
editor-settings.workspace = true
editor-marketplace.workspace = true
aqua = { workspace = true }
aqua-core = { workspace = true }
aqua-protocol = { workspace = true }
aqua-text = { workspace = true }
aqua-ui = { workspace = true }
aqua-reactive = { workspace = true }
aqua-runtime = { workspace = true, optional = true }
aqua-gpu-d3d11 = { workspace = true, optional = true }
aqua-gpu-ref = { workspace = true, optional = true }
artisan-api = { workspace = true, features = ["tls"] }
artisan-account.workspace = true
artisan-paths.workspace = true
diagnostics.workspace = true
artisan-payload.workspace = true
semver.workspace = true
editor-assets.workspace = true
editor-audio.workspace = true
forge-http = { workspace = true, optional = true }
forge-store = { workspace = true, optional = true }
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
palette.workspace = true
thiserror.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
tempfile.workspace = true
tokio-util.workspace = true
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }

[target.'cfg(windows)'.dependencies]
windows-registry = "0.6"

[target.'cfg(windows)'.dev-dependencies]
aqua-ime-tsf = { workspace = true, features = ["double"] }

[dev-dependencies]
aqua-a11y-uia = { workspace = true }
axum.workspace = true
aqua-media = { workspace = true }
base64.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
editor-aqua = { path = ".", features = ["test-support"] }
test-support = { workspace = true, features = ["shell", "net", "tokio", "http"] }

[build-dependencies]
artisan-payload.workspace = true
embed-resource = "=3.0.11"

[lints]
workspace = true
