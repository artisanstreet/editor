[package]
name = "editor-aqua"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Pixel-parity Aqua port of the Artisan Editor"
build = "build.rs"
autotests = true

[features]
test-support = []
heap-probe = ["aqua/probe-allocator"]
profile-heap = ["aqua/profile-alloc"]
qualification = ["test-support", "dep:forge-http", "dep:forge-store", "forge-store/qualification", "dep:rusqlite", "dep:sha2", "dep:hex"]
capture = ["qualification", "dep:aqua-gpu-d3d11", "dep:aqua-gpu-ref", "dep:aqua-runtime"]
source-parity = ["dep:editor-ui"]

[dependencies]
aqua = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-core = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-protocol = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-text = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-ui = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-reactive = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-runtime = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba", optional = true }
aqua-media = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-gpu-d3d11 = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba", optional = true }
aqua-gpu-ref = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba", optional = true }
artisan-api = { path = "../artisan-api", features = ["tls"] }
artisan-account = { path = "../artisan-account" }
artisan-paths = { path = "../artisan-paths" }
artisan-mentions = { path = "../artisan-mentions" }
artisan-markdown-index = { path = "../artisan-markdown-index" }
editor-assets = { path = "../editor-assets" }
editor-audio = { path = "../editor-audio" }
forge-http = { path = "../forge-http", optional = true }
forge-store = { path = "../forge-store", optional = true }
rusqlite = { workspace = true, optional = true }
sha2 = { workspace = true, optional = true }
hex = { workspace = true, optional = true }
editor-ui = { path = "../editor-ui", optional = true }
palette = "0.7"
anyhow.workspace = true
futures.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "process", "net", "io-util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
ropey.workspace = true
color.workspace = true
base64.workspace = true
tempfile.workspace = true
sse-core.workspace = true
tokio-util.workspace = true
tokio-tungstenite.workspace = true
reqwest = { workspace = true, features = ["json", "stream", "zstd"] }
claude-ai-browser = { path = "../claude-ai-browser" }
image = { workspace = true, features = ["png", "jpeg", "gif", "webp", "bmp", "tiff", "ico"] }
webp.workspace = true
pulldown-cmark.workspace = true
syntect.workspace = true
thiserror.workspace = true
mermaid-rs-renderer = { path = "../../vendor/mermaid-rs-renderer" }
vte.workspace = true
unicode-width.workspace = true
ufbx.workspace = true
stl_io.workspace = true
ply-rs-bw.workspace = true
gltf.workspace = true
glam.workspace = true
chrono = { workspace = true, features = ["clock"] }
data-url.workspace = true
file-rotate = "0.8.0"

[target.'cfg(windows)'.dev-dependencies]
aqua-a11y-uia = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba" }
aqua-ime-tsf = { git = "https://github.com/artisanstreet/aqua", rev = "059cdd83555cc01d405c0eac418e11f9209cf0ba", features = ["double"] }

[dev-dependencies]
rustls.workspace = true
tokio-rustls.workspace = true
editor-aqua = { path = ".", features = ["test-support"] }
sha2.workspace = true
hex.workspace = true

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
str_to_string = "deny"
missing_assert_message = "deny"
unwrap_in_result = "deny"
collapsible_if = "allow"
collapsible_match = "allow"
too_many_arguments = "allow"
type_complexity = "allow"
useless_conversion = "allow"
needless_borrow = "allow"
needless_borrows_for_generic_args = "allow"
large_enum_variant = "allow"
should_implement_trait = "allow"
manual_clamp = "allow"
manual_flatten = "allow"
unnecessary_fold = "allow"
unnecessary_unwrap = "allow"
unnecessary_to_owned = "allow"
unnecessary_result_map_or_else = "allow"
let_and_return = "allow"
derivable_impls = "allow"
clone_on_copy = "allow"
arc_with_non_send_sync = "allow"
rc_buffer = "allow"

[[test]]
name = "source-parity"
path = "tests/ui/theme.rs"
required-features = ["source-parity"]


[build-dependencies]
embed-resource = "=3.0.11"
