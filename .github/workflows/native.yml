name: Native Rust

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: native-rust-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bazel:
    name: Bazel / Windows
    runs-on: windows-2025
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Audit Rust target registration
        shell: pwsh
        run: ./scripts/audit_rust_target_registration.ps1

      - name: Configure Bazel
        uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # v0.19.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true

      - name: Build
        run: bazel build //...

      - name: Test
        id: bazel_test
        run: bazel test //...

      - name: Capture retained native credential ACL shape
        id: acl_diagnostic
        if: steps.bazel_test.outcome == 'failure'
        shell: pwsh
        env:
          ARTISAN_NATIVE_ACL_DIAGNOSTIC: "1"
          ARTISAN_NATIVE_ACL_DIAGNOSTIC_FILE: "${{ runner.temp }}\\artisan-native-credentials-acl-v1.json"
        run: >
          bazel test //modules/cli:cli_unit_test
          --test_filter=credentials::diagnostic_tests::retained_windows_acl_diagnostic
          --test_env=ARTISAN_NATIVE_ACL_DIAGNOSTIC
          --test_env=ARTISAN_NATIVE_ACL_DIAGNOSTIC_FILE
          --test_output=errors

      - name: Retain native credential ACL diagnostic
        if: always() && steps.acl_diagnostic.outcome != 'skipped'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-credentials-acl-v1-${{ github.run_id }}
          path: ${{ runner.temp }}\artisan-native-credentials-acl-v1.json
          if-no-files-found: error
          retention-days: 14
