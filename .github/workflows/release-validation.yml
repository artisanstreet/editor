name: Artisan release pipeline

on:
    pull_request:
        branches: [master, candidate]
    push:
        branches: [master, candidate]
    workflow_dispatch:
        inputs:
            mode:
                description: Verify a new candidate, publish it, or resume exact prior artifacts.
                type: choice
                options: [dry-run, release, resume]
                default: dry-run
                required: true
            version:
                description: Exact semantic product version for a new candidate.
                type: string
                default: 0.1.0
                required: true
            resume_version:
                description: Exact version from the candidate run being resumed.
                type: string
                required: false
            resume_commit:
                description: Exact full commit SHA from the candidate run being resumed.
                type: string
                required: false
            resume_run_id:
                description: Exact Actions run ID containing the candidate bundle.
                type: string
                required: false

permissions: {}

concurrency:
    group: ${{ github.event_name != 'workflow_dispatch' && format('artisan-staging-{0}', github.ref) || inputs.mode == 'dry-run' && format('artisan-dry-run-{0}', github.sha) || 'artisan-release' }}
    cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' || inputs.mode == 'dry-run' }}

jobs:
    plan:
        name: Plan exact release identity
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        outputs:
            assets: ${{ steps.plan.outputs.assets }}
            candidate_artifact: ${{ steps.plan.outputs.candidate_artifact }}
            commit: ${{ steps.plan.outputs.commit }}
            construct_candidate: ${{ steps.plan.outputs.construct_candidate }}
            publish: ${{ steps.plan.outputs.publish }}
            source_run_id: ${{ steps.plan.outputs.source_run_id }}
            tag: ${{ steps.plan.outputs.tag }}
            version: ${{ steps.plan.outputs.version }}
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  fetch-depth: 0
                  persist-credentials: false
                  ref: ${{ github.sha }}
            - uses: ./.github/actions/setup
            - name: Verify protected candidate pointer
              if: github.event_name == 'workflow_dispatch'
              shell: bash
              run: |
                  git fetch --no-tags origin candidate master
                  test "$(git rev-parse HEAD)" = "$(git rev-parse origin/candidate)"
                  git merge-base --is-ancestor origin/candidate origin/master
                  if [ "${{ inputs.mode }}" = resume ]; then
                    git merge-base --is-ancestor "${{ inputs.resume_commit }}" origin/master
                  fi
            - name: Create immutable plan
              id: plan
              shell: bash
              env:
                  EVENT: ${{ github.event_name }}
                  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'dry-run' }}
                  RELEASE_VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '0.1.0' }}
                  RESUME_COMMIT: ${{ inputs.resume_commit }}
                  RESUME_RUN_ID: ${{ inputs.resume_run_id }}
                  RESUME_VERSION: ${{ inputs.resume_version }}
              run: |
                  node build/release/cli.ts \
                    --event "$EVENT" \
                    --ref "${{ github.ref }}" \
                    --commit "${{ github.sha }}" \
                    --version "$RELEASE_VERSION" \
                    --run-id "${{ github.run_id }}" \
                    --mode "$MODE" \
                    --resume-commit "${RESUME_COMMIT:-${{ github.sha }}}" \
                    --resume-version "${RESUME_VERSION:-$RELEASE_VERSION}" \
                    --resume-run-id "${RESUME_RUN_ID:-${{ github.run_id }}}" \
                    --output release-plan.json \
                    --github-output "$GITHUB_OUTPUT"
            - name: Reject a preexisting fresh release identity
              if: github.event_name == 'workflow_dispatch' && inputs.mode == 'release'
              env:
                  GH_TOKEN: ${{ github.token }}
              run: |
                  if gh api "repos/${{ github.repository }}/git/ref/tags/v${{ inputs.version }}" >/dev/null 2>&1; then
                    echo "Tag v${{ inputs.version }} already exists; use exact resume." >&2
                    exit 1
                  fi
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: release-plan-${{ github.run_id }}
                  path: release-plan.json
                  if-no-files-found: error
                  retention-days: 90

    staging:
        name: Fast staging gate
        needs: plan
        runs-on: ubuntu-24.04
        timeout-minutes: 20
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Static and release policy checks
              run: |
                  pnpm run check
                  pnpm exec vitest run .tests/release
                  cargo fmt --all -- --check

    lane_policy:
        name: Platform lane policy
        needs: plan
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Report qualified and blocked lanes
              run: pnpm exec vitest run .tests/release/policy.test.ts

    native_matrix:
        name: Native evidence / ${{ matrix.lane }}
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'resume'
        needs: [plan, staging]
        strategy:
            fail-fast: false
            matrix:
                include:
                    - lane: windows-x64
                      os: windows-2025
                      bootstrap: artisan-bootstrap-windows-x64.exe
                      cli: ae-windows-x64.exe
                    - lane: macos-arm64
                      os: macos-15
                      bootstrap: artisan-bootstrap-macos-arm64
                      cli: ae-macos-arm64
                    - lane: linux-x64-gnu
                      os: ubuntu-24.04
                      bootstrap: artisan-bootstrap-linux-x64-gnu
                      cli: ae-linux-x64-gnu
        runs-on: ${{ matrix.os }}
        timeout-minutes: 25
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
            - uses: ./.github/actions/setup
            - name: Build native bootstrap and CLI evidence
              shell: bash
              env:
                  ARTISAN_RELEASE_PUBLIC_KEY_HEX: ${{ vars.ARTISAN_RELEASE_PUBLIC_KEY_HEX }}
              run: |
                  test -n "$ARTISAN_RELEASE_PUBLIC_KEY_HEX"
                  cargo build --workspace --release --locked
                  mkdir -p native-evidence
                  if [ "${{ runner.os }}" = Windows ]; then
                    cp target/release/artisan-bootstrap.exe "native-evidence/${{ matrix.bootstrap }}"
                    cp target/release/ae.exe "native-evidence/${{ matrix.cli }}"
                  else
                    cp target/release/artisan-bootstrap "native-evidence/${{ matrix.bootstrap }}"
                    cp target/release/ae "native-evidence/${{ matrix.cli }}"
                  fi
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: native-evidence-${{ matrix.lane }}-${{ needs.plan.outputs.commit }}-${{ github.run_id }}
                  path: native-evidence
                  if-no-files-found: error
                  retention-days: 14

    windows_product:
        name: Qualified product / Windows x64
        if: github.event_name == 'workflow_dispatch' && inputs.mode != 'resume'
        needs: [plan, staging]
        runs-on: windows-2025
        timeout-minutes: 45
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - uses: ./.github/actions/setup
            - name: Build explicitly unsigned prerelease payload
              shell: pwsh
              env:
                  ARTISAN_ALLOW_UNSIGNED_PRERELEASE: "1"
                  ARTISAN_RELEASE_ARCHITECTURE: x64
                  ARTISAN_RELEASE_CHANNEL: beta
                  ARTISAN_RELEASE_SIGNING_KEY_ID: ${{ secrets.ARTISAN_RELEASE_SIGNING_KEY_ID }}
                  ARTISAN_RELEASE_SIGNING_KEY_PEM: ${{ secrets.ARTISAN_RELEASE_SIGNING_KEY_PEM }}
                  ARTISAN_RELEASE_VERSION: ${{ needs.plan.outputs.version }}
              run: |
                  $ErrorActionPreference = "Stop"
                  $PSNativeCommandUseErrorActionPreference = $true
                  if ([string]::IsNullOrWhiteSpace($env:ARTISAN_RELEASE_SIGNING_KEY_PEM)) {
                      throw "ARTISAN_RELEASE_SIGNING_KEY_PEM is required"
                  }
                  $public_key_hex = node -e "const {createPublicKey}=require('node:crypto'); process.stdout.write(createPublicKey(process.env.ARTISAN_RELEASE_SIGNING_KEY_PEM).export({format:'der',type:'spki'}).toString('hex'))"
                  $env:ARTISAN_RELEASE_PUBLIC_KEY_HEX = $public_key_hex
                  pnpm exec install-electron
                  if (-not (Test-Path -LiteralPath "node_modules/electron/dist/electron.exe")) {
                      throw "Electron runtime installation did not produce electron.exe"
                  }
                  pnpm run package:desktop
                  cargo build --workspace --release --locked
                  node .scripts/package/build-distribution-release-entry.ts
                  if ($LASTEXITCODE -ne 0) {
                      throw "Distribution release builder failed with exit code $LASTEXITCODE"
                  }
                  $bootstrap = ".dist/distribution-release/artisan-bootstrap-windows-x64.exe"
                  if (-not (Test-Path -LiteralPath ".dist/distribution-release")) {
                      throw "Distribution release builder did not create its output directory"
                  }
                  Copy-Item target/release/artisan-bootstrap.exe $bootstrap
                  $digest = (Get-FileHash -LiteralPath $bootstrap -Algorithm SHA256).Hash.ToLowerInvariant()
                  "$digest  artisan-bootstrap-windows-x64.exe" | Set-Content -NoNewline "$bootstrap.sha256"
                  & $bootstrap --help | Out-Null
                  pnpm run verify:desktop-package
                  pnpm run verify:distribution:windows
                  .tests/install-transport/windows.ps1
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              with:
                  name: windows-product-${{ needs.plan.outputs.commit }}-${{ github.run_id }}
                  path: |
                      .dist/distribution-release/*.zip
                      .dist/distribution-release/artisan-bootstrap-windows-x64.exe
                      .dist/distribution-release/artisan-bootstrap-windows-x64.exe.sha256
                      .dist/distribution-release/release-manifest.json
                      .dist/distribution-release/release-manifest.sig
                  if-no-files-found: error
                  retention-days: 90

    candidate:
        name: Construct or restore exact candidate
        if: always() && github.event_name == 'workflow_dispatch' && needs.plan.result == 'success' && needs.staging.result == 'success'
        needs: [plan, staging, native_matrix, windows_product]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - name: Download exact release plan
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: release-plan-${{ github.run_id }}
                  path: selected-plan
            - name: Download newly built product
              if: inputs.mode != 'resume'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: windows-product-${{ needs.plan.outputs.commit }}-${{ github.run_id }}
                  path: candidate/assets
            - name: Restore exact prior candidate
              if: inputs.mode == 'resume'
              uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
                  run-id: ${{ needs.plan.outputs.source_run_id }}
                  github-token: ${{ github.token }}
            - name: Freeze candidate identity
              if: inputs.mode != 'resume'
              shell: bash
              run: |
                  cp selected-plan/release-plan.json candidate/release-plan.json
                  printf '%s\n' \
                    "version=${{ needs.plan.outputs.version }}" \
                    "commit=${{ needs.plan.outputs.commit }}" \
                    "run_id=${{ github.run_id }}" > candidate/IDENTITY
                  node build/release/artifact-cli.ts create candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ github.run_id }}"
            - name: Verify exact asset allowlist and identity
              shell: bash
              env:
                  EXPECTED_ASSETS: ${{ needs.plan.outputs.assets }}
              run: |
                  test "$(sed -n '1p' candidate/IDENTITY)" = "version=${{ needs.plan.outputs.version }}"
                  test "$(sed -n '2p' candidate/IDENTITY)" = "commit=${{ needs.plan.outputs.commit }}"
                  test "$(sed -n '3p' candidate/IDENTITY)" = "run_id=${{ needs.plan.outputs.source_run_id }}"
                  node -e 'const fs=require("fs"); const selected=JSON.parse(fs.readFileSync("selected-plan/release-plan.json")); const frozen=JSON.parse(fs.readFileSync("candidate/release-plan.json")); for(const key of ["version","commit","run_id","candidate_artifact"]) if(selected[key] !== frozen[key]) throw new Error(`frozen plan ${key} drift`)'
                  node -e 'const fs=require("fs"); const expected=JSON.parse(process.env.EXPECTED_ASSETS).sort(); const actual=fs.readdirSync("candidate/assets").sort(); if(JSON.stringify(actual)!==JSON.stringify(expected)) throw new Error(`asset drift: ${actual}`)'
                  node build/release/artifact-cli.ts verify candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ needs.plan.outputs.source_run_id }}"
            - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
              if: inputs.mode != 'resume'
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
                  if-no-files-found: error
                  retention-days: 90

    candidate_verify:
        name: Verify and smoke frozen candidate
        if: always() && needs.plan.result == 'success' && needs.candidate.result == 'success'
        needs: [plan, candidate]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
                  run-id: ${{ needs.plan.outputs.source_run_id }}
                  github-token: ${{ github.token }}
            - name: Verify manifest and smoke archive contract
              run: |
                  node build/release/artifact-cli.ts verify candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ needs.plan.outputs.source_run_id }}"
                  node -e 'const fs=require("fs"); const manifest=JSON.parse(fs.readFileSync("candidate/assets/release-manifest.json")); if(manifest.product_version !== "${{ needs.plan.outputs.version }}") throw new Error("distribution manifest version drift"); if(manifest.artifacts.length !== 1 || manifest.artifacts[0].file_name !== "artisan-${{ needs.plan.outputs.version }}-windows-x64.zip") throw new Error("distribution archive contract drift")'

    dry_run_evidence:
        name: Dry run / Verify without provider writes
        if: inputs.mode == 'dry-run'
        needs: [plan, candidate_verify]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: read
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
            - name: Produce read-only publication evidence
              run: |
                  node build/release/artifact-cli.ts verify candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ github.run_id }}"

    github_prepare:
        name: GitHub / Prepare draft
        if: always() && needs.plan.result == 'success' && needs.candidate_verify.result == 'success' && needs.plan.outputs.publish == 'true'
        needs: [plan, candidate_verify]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        environment: release-approval
        permissions:
            contents: write
        steps:
            - name: Create or verify matching draft
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.plan.outputs.tag }}
                  COMMIT: ${{ needs.plan.outputs.commit }}
              run: |
                  existing="$(gh release view "$TAG" --repo "$REPOSITORY" --json isDraft,targetCommitish --jq '[.isDraft,.targetCommitish]|@tsv' 2>/dev/null || true)"
                  if [ -z "$existing" ]; then
                    gh release create "$TAG" --repo "$REPOSITORY" --target "$COMMIT" --draft --title "$TAG" --notes "Beta-semver Artisan release. This build is intentionally unsigned; stable code-signing remains required before stable qualification."
                  elif [ "$existing" != "$(printf 'true\t%s' "$COMMIT")" ]; then
                    echo "Existing release identity does not match the candidate." >&2
                    exit 1
                  fi

    github_upload:
        name: GitHub / Upload exact assets
        needs: [plan, candidate, github_prepare]
        runs-on: ubuntu-24.04
        timeout-minutes: 15
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
                  run-id: ${{ needs.plan.outputs.source_run_id }}
                  github-token: ${{ github.token }}
            - name: Upload absent assets and reject byte drift
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.plan.outputs.tag }}
              run: |
                  mkdir -p observed
                  for asset in candidate/assets/*; do
                    name="$(basename "$asset")"
                    if gh release download "$TAG" --repo "$REPOSITORY" --pattern "$name" --dir observed 2>/dev/null; then
                      cmp --silent "$asset" "observed/$name" || {
                        echo "Existing GitHub asset $name differs from the frozen candidate." >&2
                        exit 1
                      }
                    else
                      gh release upload "$TAG" "$asset" --repo "$REPOSITORY"
                    fi
                  done
                  actual="$(gh release view "$TAG" --repo "$REPOSITORY" --json assets --jq '[.assets[].name] | sort | join(\"\\n\")')"
                  expected="$(find candidate/assets -maxdepth 1 -type f -printf '%f\n' | sort)"
                  test "$actual" = "$expected"
                  node build/release/artifact-cli.ts verify candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ needs.plan.outputs.source_run_id }}"

    github_finalize:
        name: GitHub / Finalize release
        needs: [plan, github_upload]
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            actions: read
            contents: write
        steps:
            - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
              with:
                  persist-credentials: false
                  ref: ${{ needs.plan.outputs.commit }}
            - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
              with:
                  name: ${{ needs.plan.outputs.candidate_artifact }}
                  path: candidate
                  run-id: ${{ needs.plan.outputs.source_run_id }}
                  github-token: ${{ github.token }}
            - name: Reverify frozen bytes and publish normal latest-eligible release
              env:
                  GH_TOKEN: ${{ github.token }}
                  REPOSITORY: ${{ github.repository }}
                  TAG: ${{ needs.plan.outputs.tag }}
              run: |
                  node build/release/artifact-cli.ts verify candidate/assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ needs.plan.outputs.source_run_id }}"
                  mkdir provider-assets
                  gh release download "$TAG" --repo "$REPOSITORY" --dir provider-assets
                  node build/release/artifact-cli.ts verify provider-assets candidate/artifact-manifest.json \
                    "${{ needs.plan.outputs.version }}" "${{ needs.plan.outputs.commit }}" "${{ needs.plan.outputs.source_run_id }}"
                  gh release edit "$TAG" --repo "$REPOSITORY" --draft=false --prerelease=false --latest
