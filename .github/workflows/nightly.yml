name: Nightly checks
on:
  schedule:
    - cron: '30 2 * * *'
  workflow_dispatch:
    inputs:
      seeds:
        description: How many random seeds the Forge simulation sweeps
        default: '400'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: nightly-checks
  cancel-in-progress: false
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  CI: 'true'
  NEXTEST_PROFILE: ci
jobs:
  simulation:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
      - name: Sweep random seeds through Forge's fault simulation
        env:
          SIMULATION_SWEEP: ${{ inputs.seeds || '400' }}
        run: |
          nix develop .#cargo-linux --command cargo nextest run --locked -p forge-http \
            --test simulation --example replay_engine --no-capture 2>&1 | tee simulation.log
      - name: Name the failing seed
        if: failure()
        run: |
          {
            echo '## Forge simulation'
            echo '```'
            grep -E '^(sweeping|simulation seed|replay it with)' simulation.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: simulation-log
          path: simulation.log
