name: Verify native file mutation

on:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: native-file-mutation-${{ github.ref }}
    cancel-in-progress: false

jobs:
    verify-windows-ntfs:
        runs-on: windows-2025
        timeout-minutes: 20

        steps:
            - name: Check out repository
              uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

            - name: Install pnpm
              uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
              with:
                  version: 11.7.0
                  run_install: false

            - name: Install Node.js
              uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
              with:
                  node-version: 24
                  cache: pnpm

            - name: Install Rust toolchain
              shell: pwsh
              run: rustup toolchain install 1.97.0-x86_64-pc-windows-msvc --profile minimal --component clippy,rustfmt

            - name: Install workspace dependencies
              run: pnpm install --frozen-lockfile

            - name: Check workspace formatting
              run: pnpm run format:check

            - name: Lint workspace
              run: pnpm run lint

            - name: Typecheck workspace
              run: pnpm run check

            - name: Check native formatting
              working-directory: modules/bounded-file-store-native
              run: cargo +1.97.0-x86_64-pc-windows-msvc fmt --check

            - name: Check native code
              working-directory: modules/bounded-file-store-native
              run: cargo +1.97.0-x86_64-pc-windows-msvc clippy --target x86_64-pc-windows-msvc --locked -- -D warnings

            - name: Build production MSVC binding
              run: pnpm --filter @artisan/bounded-file-store-native build

            - name: Verify pinned-root reads
              env:
                  ARTISAN_RUN_NATIVE_READ_SMOKE: "1"
              run: node .tests/bounded-file-store-native/native-read-smoke.cjs ./.dist/bounded-file-store-native

            - name: Verify authenticated replacement and recovery
              env:
                  ARTISAN_RUN_NATIVE_REPLACE_SMOKE: "1"
              run: node .tests/bounded-file-store-native/native-replace-smoke.cjs ./.dist/bounded-file-store-native

            - name: Build native test-hook binding
              run: pnpm --filter @artisan/bounded-file-store-native build:test-hooks

            - name: Verify deterministic replacement races
              env:
                  ARTISAN_RUN_NATIVE_REPLACE_SMOKE: "1"
                  ARTISAN_RUN_NATIVE_RACE_SMOKE: "1"
                  UV_THREADPOOL_SIZE: "4"
              run: node .tests/bounded-file-store-native/native-replace-smoke.cjs ./.dist/bounded-file-store-native-test

            - name: Verify process-crash recovery windows
              env:
                  ARTISAN_RUN_NATIVE_CRASH_SMOKE: "1"
              run: node .tests/bounded-file-store-native/native-replace-crash-smoke.cjs ./.dist/bounded-file-store-native-test
