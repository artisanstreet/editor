name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_BUILD_JOBS: 2
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  INSTA_UPDATE: 'no'
  CI: 'true'
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate workflows
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Release tooling tests
        if: ${{ hashFiles('tests/release.py') != '' }}
        run: python3 tests/release.py
      - name: Clippy
        run: nix develop .#cargo-linux --command cargo clippy --locked --workspace --all-targets
      - name: Build service integration fixtures
        run: nix develop .#cargo-linux --command cargo build --locked -p ae -p forge
      - name: Tests
        run: nix develop .#cargo-linux --command cargo test --locked --workspace
  windows:
    needs: linux
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo build --locked -p ae -p forge
      - run: cargo test --locked --workspace
  macos:
    needs: linux
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup show
      - name: Build the CLI and Forge without Aqua
        run: cargo build --locked -p ae -p forge
      - name: Test shared backend contracts
        run: cargo test --locked -p artisan-api -p artisan-account -p artisan-paths -p forge-store
