name: Cargo and Nix
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux-checks:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        check: [clippy, tests]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }} --no-link
  windows:
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      CARGO_BUILD_JOBS: 2
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo test --locked --workspace
  packages:
    needs: [linux-checks, windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7 # v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
            max-jobs = 1
            cores = 2
      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        if: vars.CACHIX_CACHE != ''
        with:
          name: ${{ vars.CACHIX_CACHE }}
          skipPush: true
      - name: Build the unsigned release
        run: |
          nix build -L .#release --out-link result-release
          mkdir artifacts
          cp -L result-release/* artifacts/
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: artisan-release-unsigned
          path: artifacts/
          if-no-files-found: error
      - name: Cache successful outputs from the default branch
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch && vars.CACHIX_CACHE != ''
        env:
          CACHIX_AUTH_TOKEN: ${{ secrets.CACHIX_AUTH_TOKEN }}
          CACHIX_CACHE: ${{ vars.CACHIX_CACHE }}
        run: |
          test -n "$CACHIX_AUTH_TOKEN"
          nix path-info --recursive ./result-release | cachix push "$CACHIX_CACHE"
