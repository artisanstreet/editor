name: Validate

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: validate-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Windows clean checkout
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - name: Prepare canonical validation temp root
              shell: pwsh
              run: |
                  $validation_temp = Join-Path (Split-Path -Qualifier "${{ github.workspace }}") "artisan-validation-${{ github.run_id }}"
                  New-Item -ItemType Directory -Force -Path $validation_temp | Out-Null
                  "TEMP=$validation_temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
                  "TMP=$validation_temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

            - run: pnpm run validate
