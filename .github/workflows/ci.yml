name: CI
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  INSTA_UPDATE: 'no'
  CI: 'true'
  SCCACHE_BUCKET: artisan-sccache
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: 'true'
  SCCACHE_S3_KEY_PREFIX: rust
  SCCACHE_S3_RW_MODE: ${{ github.event_name != 'pull_request' && 'READ_WRITE' || 'READ_ONLY' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  AWS_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID || secrets.SCCACHE_R2_READ_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || secrets.SCCACHE_R2_READ_SECRET_ACCESS_KEY }}
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate workflows
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - name: Release tooling tests
        if: ${{ hashFiles('tests/release.py') != '' }}
        run: python3 tests/release.py
      - name: Clippy
        run: nix develop .#cargo-linux --command cargo clippy --locked --workspace --all-targets
      - name: Build service integration fixtures
        run: nix develop .#cargo-linux --command cargo build --locked -p ae -p forge
      - name: Tests
        run: nix develop .#cargo-linux --command cargo test --locked --workspace
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        shell: bash
        run: '"$SCCACHE_PATH" --show-stats'
  windows:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets
      - run: cargo build --locked -p ae -p forge
      - run: cargo test --locked --workspace --no-fail-fast
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        shell: bash
        run: '"$SCCACHE_PATH" --show-stats'
  macos:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
          restore-keys: cargo-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup show
      - name: Build the CLI and Forge without Aqua
        run: cargo build --locked -p ae -p forge
      - name: Test shared backend contracts
        run: cargo test --locked -p artisan-api -p artisan-account -p artisan-paths -p forge-store
      - name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        shell: bash
        run: '"$SCCACHE_PATH" --show-stats'
