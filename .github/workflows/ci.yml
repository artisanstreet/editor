name: Validate

on:
    push:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

concurrency:
    group: validate-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    validate:
        name: Windows clean checkout
        runs-on: windows-2025
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v5

            - uses: pnpm/action-setup@v4
              with:
                  version: 11.7.0

            - uses: actions/setup-node@v5
              with:
                  node-version: 24
                  cache: pnpm
                  cache-dependency-path: pnpm-lock.yaml

            - run: pnpm install --frozen-lockfile

            - name: Prepare canonical validation temp root
              shell: pwsh
              run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}\.tmp" | Out-Null

            - run: pnpm run validate
              env:
                  TEMP: ${{ github.workspace }}\.tmp
                  TMP: ${{ github.workspace }}\.tmp
