name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
  INSTA_UPDATE: 'no'
  CI: 'true'
  NEXTEST_PROFILE: ci
  SAVE_TARGET_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
  SCCACHE_BUCKET: artisan-sccache
  SCCACHE_ENDPOINT: ${{ vars.SCCACHE_ENDPOINT }}
  SCCACHE_REGION: auto
  SCCACHE_S3_USE_SSL: 'true'
  SCCACHE_S3_KEY_PREFIX: rust
  SCCACHE_S3_RW_MODE: ${{ github.event_name != 'pull_request' && 'READ_WRITE' || 'READ_ONLY' }}
  SCCACHE_IGNORE_SERVER_IO_ERROR: '1'
  AWS_ACCESS_KEY_ID: ${{ github.event_name != 'pull_request' && secrets.SCCACHE_R2_WRITE_ACCESS_KEY_ID || secrets.SCCACHE_R2_READ_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ github.event_name != 'pull_request' && secrets.SCCACHE_R2_WRITE_SECRET_ACCESS_KEY || secrets.SCCACHE_R2_READ_SECRET_ACCESS_KEY }}
jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Validate workflows
        run: nix shell --inputs-from . nixpkgs#actionlint --command actionlint
      - run: rustup show
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Dependency advisories, licences and bans
        run: nix shell --inputs-from . nixpkgs#cargo-deny --command cargo deny --locked check advisories licenses bans
      - name: Release tooling tests
        run: python3 tests/release.py
      - name: Present a WSL interop registration to the dev launcher
        run: |
          mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          echo ':WSLInterop:M::MZ::/bin/false:' | sudo tee /proc/sys/fs/binfmt_misc/register > /dev/null
          test -e /proc/sys/fs/binfmt_misc/WSLInterop
      - name: Dev launcher tests
        shell: bash
        run: |
          python3 tests/nix/dev.py 2>&1 | tee dev.log
          if grep -q 'skipped' dev.log; then echo 'dev launcher tests were skipped' >&2; exit 1; fi
      - name: Vendored highlighting provenance
        run: python3 vendor/highlighting/verify.py
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
      - name: Restore the build cache
        id: target-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', 'flake.lock', '.cargo/config.toml') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - name: Clippy
        run: nix develop .#cargo-linux --command cargo clippy --locked --workspace --all-targets
      - name: Clippy with qualification
        run: nix develop .#cargo-linux --command cargo clippy --locked -p editor-aqua --all-targets --features qualification
      - name: Build service integration fixtures
        run: nix develop .#cargo-linux --command cargo build --locked -p ae -p forge
      - name: Tests
        run: nix develop .#cargo-linux --command cargo nextest run --locked --workspace --no-fail-fast
      - name: Qualification tests
        run: nix develop .#cargo-linux --command cargo nextest run --locked -p editor-aqua --features qualification --no-fail-fast
      - &save-target
        name: Save the build cache
        if: ${{ !cancelled() && env.SAVE_TARGET_CACHE == 'true' && steps.target-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.target-cache.outputs.cache-primary-key }}
      - &sccache-stats
        name: sccache stats
        if: always() && env.RUSTC_WRAPPER != ''
        shell: bash
        run: '"$SCCACHE_PATH" --show-stats'
  windows:
    runs-on: windows-2025
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
      - &restore-target-cargo
        name: Restore the build cache
        id: target-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-${{ github.sha }}
          restore-keys: |
            cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}-
            cargo-${{ github.job }}-${{ runner.os }}-${{ runner.arch }}-
      - run: rustup show
      - run: cargo clippy --locked --workspace --all-targets
      - name: Clippy with capture
        run: cargo clippy --locked -p editor-aqua --all-targets --features capture
      - name: Build service integration fixtures
        run: cargo build --locked -p ae -p forge
      - name: Tests
        run: cargo nextest run --locked --workspace --no-fail-fast
      - name: Qualification and capture tests
        run: cargo nextest run --locked -p editor-aqua --features capture --no-fail-fast
      - *save-target
      - *sccache-stats
  macos:
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
      - *restore-target-cargo
      - run: rustup show
      - name: Build service integration fixtures
        run: cargo build --locked -p ae -p forge
      - name: Tests
        run: cargo nextest run --locked --workspace --no-fail-fast
      - *save-target
      - *sccache-stats
  shipping:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - *restore-target-cargo
      - run: rustup show
      - name: Build the shipped binaries with default features and no test support
        run: cargo build --locked -p ae -p forge -p editor-aqua --bins
      - *save-target
      - *sccache-stats
  nix-packages:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@b85815f71a6de0ddee80b8a80a98d43f4bcc66c7
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: Build the packages the NixOS module installs
        run: nix build --no-link --print-build-logs .#ae .#forge
  highlighting:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CARGO_TARGET_DIR: target/highlighting
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: mozilla-actions/sccache-action@fc920bf0ec8de6ee65d409111f7ec508035751ba
        with:
          version: v0.19.0
      - name: Compile through sccache
        if: env.AWS_ACCESS_KEY_ID != ''
        shell: bash
        run: echo "RUSTC_WRAPPER=$SCCACHE_PATH" >> "$GITHUB_ENV"
      - uses: taiki-e/install-action@ab49d3c64680143e184118bed66a46419fc15519
        with:
          tool: cargo-nextest@0.9.152
      - run: rustup show
      - name: Highlighting regression tests
        run: cargo nextest run --manifest-path vendor/highlighting/validation/Cargo.toml --config-file .config/nextest.toml --locked --cargo-profile release --no-fail-fast
      - name: Highlighting pattern coverage
        run: cargo run --manifest-path vendor/highlighting/validation/Cargo.toml --locked --release --bin check_patterns
      - *sccache-stats
