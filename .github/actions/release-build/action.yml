name: Build Forge and ae for a release
description: Stamps the release version, then builds Forge and the ae that carries it for one target
inputs:
  target:
    description: Rust target triple
    required: true
runs:
  using: composite
  steps:
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          target
        key: release-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-${{ hashFiles('Cargo.lock', 'rust-toolchain.toml', '.cargo/config.toml') }}
        restore-keys: release-${{ runner.os }}-${{ runner.arch }}-${{ inputs.target }}-
    - name: Prepare the native build
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        key="$(python3 src/release.py key)"
        echo "ARTISAN_RELEASE_PUBLIC_KEY_HEX=$key" >> "$GITHUB_ENV"
        python3 src/release.py stamp --version "$RELEASE_VERSION"
        rustup target add "$TARGET"
        rustup show
    - name: Build Forge
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: cargo build --locked --release --target "$TARGET" -p forge
    - name: Build ae carrying Forge
      shell: bash
      env:
        TARGET: ${{ inputs.target }}
      run: |
        root="$PWD"
        suffix=""
        if [[ "$RUNNER_OS" == Windows ]]; then
          root="$(cygpath -m "$PWD")"
          suffix=.exe
        fi
        ARTISAN_FORGE_PAYLOAD="$root/target/$TARGET/release/forge$suffix" cargo build --locked --release --target "$TARGET" -p ae
        actual="$("target/$TARGET/release/ae$suffix" --version)"
        [[ "$actual" == "ae $RELEASE_VERSION ($ARTISAN_COMMIT, $TARGET)" ]]
