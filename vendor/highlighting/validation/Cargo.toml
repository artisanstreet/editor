[package]
name = "artisan-highlighting-regressions"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[features]
default = ["regex-onig"]
regex-onig = []
regex-fancy = []

[dependencies]
syntect = { path = "../syntect", version = "=5.3.0", default-features = false, features = ["parsing", "default-syntaxes", "regex-onig"] }
onig = { path = "../onig", version = "=6.5.3", default-features = false }
fancy-regex = "=0.16.2"
once_cell = "1.21"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[patch.crates-io]
onig = { path = "../onig" }
