[package]
name = "artisan-native-dev"
description = "Development installer: install a Nix-built payload as a signed dev-channel release into the per-user Artisan Street Dev installation and launch the installed Editor on its owned Forge"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "native_dev"
path = "src/lib.rs"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
ae-installer = { path = "../../modules/installer" }
artisan-build-info = { path = "../../modules/build_info" }
artisan-editor-cli = { path = "../../modules/cli" }
fs2.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
ae-installer = { path = "../../modules/installer" }
artisan-build-info = { path = "../../modules/build_info" }
artisan-editor-cli = { path = "../../modules/cli" }
fs2.workspace = true
serde_json.workspace = true

[[test]]
name = "dev_args"
path = "../../tests/native_dev/dev_args.rs"

[[test]]
name = "dev_layout"
path = "../../tests/native_dev/dev_layout.rs"

[[test]]
name = "dev_launch"
path = "../../tests/native_dev/dev_launch.rs"

[[test]]
name = "dev_payload"
path = "../../tests/native_dev/dev_payload.rs"

[[test]]
name = "dev_instance"
path = "../../tests/native_dev/dev_instance.rs"

[[test]]
name = "dev_binaries"
path = "../../tests/native_dev/dev_binaries.rs"

[[test]]
name = "dev_stage"
path = "../../tests/native_dev/dev_stage.rs"

[[bin]]
name = "forge-host"
path = "src/forge_host.rs"
