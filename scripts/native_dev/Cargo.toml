[package]
name = "artisan-native-dev"
description = "One-command native development installation: stage product Editor and Forge binaries under .dist/dev and launch the staged Editor on its owned Forge with startup confirmation"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "native_dev"
path = "src/lib.rs"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
artisan-editor-cli = { path = "../../modules/cli" }
fs2.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
artisan-editor-cli = { path = "../../modules/cli" }
fs2.workspace = true
serde_json.workspace = true

[[test]]
name = "dev_args"
path = "../../tests/native_dev/dev_args.rs"

[[test]]
name = "dev_layout"
path = "../../tests/native_dev/dev_layout.rs"

[[test]]
name = "dev_launch"
path = "../../tests/native_dev/dev_launch.rs"

[[test]]
name = "dev_manifest"
path = "../../tests/native_dev/dev_manifest.rs"

[[test]]
name = "dev_instance"
path = "../../tests/native_dev/dev_instance.rs"

[[test]]
name = "dev_runfiles"
path = "../../tests/native_dev/dev_runfiles.rs"

[[test]]
name = "dev_stage"
path = "../../tests/native_dev/dev_stage.rs"
