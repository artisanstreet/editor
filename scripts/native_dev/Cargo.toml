[package]
name = "artisan-native-dev"
description = "`nix run .#dev`: build the product with Nix and deploy the Linux Forge service and the Editor through the shipping installer"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "native_dev"
path = "src/lib.rs"

[[bin]]
name = "dev"
path = "src/main.rs"

[dependencies]
ae-installer = { path = "../../modules/installer" }
artisan-build-info = { path = "../../modules/build_info" }
artisan-database = { path = "../../modules/database" }
artisan-editor-cli = { path = "../../modules/cli" }
fs2.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["rt"] }

[lints]
workspace = true

[dev-dependencies]
base64.workspace = true
clap = { version = "=4.6.6", features = ["derive", "env"] } # workspace-absent
tempfile = "=3.27.0" # workspace-absent

[[test]]
name = "dev_args"
path = "../../tests/native_dev/dev_args.rs"

[[test]]
name = "dev_layout"
path = "../../tests/native_dev/dev_layout.rs"

[[test]]
name = "dev_launch"
path = "../../tests/native_dev/dev_launch.rs"

[[test]]
name = "dev_payload"
path = "../../tests/native_dev/dev_payload.rs"

[[test]]
name = "dev_provision"
path = "../../tests/native_dev/dev_provision.rs"

[[test]]
name = "dev_binaries"
path = "../../tests/native_dev/dev_binaries.rs"

[[test]]
name = "dev_stage"
path = "../../tests/native_dev/dev_stage.rs"

[[test]]
name = "dev_legacy"
path = "../../tests/native_dev/dev_legacy.rs"

[[test]]
name = "dev_nix"
path = "../../tests/native_dev/dev_nix.rs"

[[test]]
name = "dev_editor"
path = "../../tests/native_dev/dev_editor.rs"

[[bin]]
name = "forge-host"
path = "src/forge_host.rs"
