[workspace]
members = [
    "crates/ae",
    "crates/artisan-account",
    "crates/artisan-api",
    "crates/artisan-markdown-index",
    "crates/artisan-paths",
    "crates/artisan-payload",
    "crates/build-info",
    "crates/artisan-mentions",
    "crates/claude-ai-browser",
    "crates/diagnostics",
    "crates/editor-aqua",
    "crates/editor-core",
    "crates/editor-ui",
    "crates/editor-sources",
    "crates/editor-composer",
    "crates/editor-conversation",
    "crates/editor-sidebar",
    "crates/editor-inspector",
    "crates/editor-settings",
    "crates/editor-marketplace",
    "crates/editor-assets",
    "crates/editor-audio",
    "crates/forge",
    "crates/forge-content",
    "crates/forge-computer",
    "crates/forge-engines",
    "crates/forge-http",
    "crates/forge-isolation",
    "crates/forge-mcp",
    "crates/forge-runs",
    "crates/forge-store",
    "crates/test-support",
]
exclude = [
    "vendor/highlighting/syntect",
    "vendor/highlighting/onig",
    "vendor/highlighting/onig_sys",
    "vendor/highlighting/validation",
    "vendor/mermaid-rs-renderer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/artisanstreet/editor"
rust-version = "1.98.0"
version = "0.0.0"

[workspace.dependencies]
artisan-account = { path = "crates/artisan-account" }
artisan-api = { path = "crates/artisan-api" }
artisan-markdown-index = { path = "crates/artisan-markdown-index" }
artisan-mentions = { path = "crates/artisan-mentions" }
artisan-paths = { path = "crates/artisan-paths" }
artisan-payload = { path = "crates/artisan-payload" }
build-info = { path = "crates/build-info" }
claude-ai-browser = { path = "crates/claude-ai-browser" }
diagnostics = { path = "crates/diagnostics" }
editor-aqua = { path = "crates/editor-aqua" }
editor-assets = { path = "crates/editor-assets" }
editor-audio = { path = "crates/editor-audio" }
editor-composer = { path = "crates/editor-composer" }
editor-conversation = { path = "crates/editor-conversation" }
editor-core = { path = "crates/editor-core" }
editor-inspector = { path = "crates/editor-inspector" }
editor-marketplace = { path = "crates/editor-marketplace" }
editor-settings = { path = "crates/editor-settings" }
editor-sidebar = { path = "crates/editor-sidebar" }
editor-sources = { path = "crates/editor-sources" }
editor-ui = { path = "crates/editor-ui" }
forge-computer = { path = "crates/forge-computer" }
forge-content = { path = "crates/forge-content" }
forge-engines = { path = "crates/forge-engines" }
forge-http = { path = "crates/forge-http" }
forge-isolation = { path = "crates/forge-isolation" }
forge-mcp = { path = "crates/forge-mcp" }
forge-runs = { path = "crates/forge-runs" }
forge-store = { path = "crates/forge-store" }
test-support = { path = "crates/test-support" }
semver = "=1.0.28"
palette = "0.7"
rustix = "=1.1.6"
notify = "=8.2.0"
windows = "=0.62.2"
addr2line = { version = "=0.27.1", default-features = false, features = ["std", "loader"] }
backtrace = "=0.3.76"
libc = "=0.2.189"
object = { version = "=0.37.3", default-features = false, features = ["read", "std"] }
