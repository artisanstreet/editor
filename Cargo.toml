[workspace]
members = [
    "modules/assets",
    "modules/backend",
    "modules/database",
    "modules/domain",
    "modules/frontend",
    "modules/migrations",
    "modules/protocol",
    "modules/transport",
    "modules/ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/sandersonstabo/artisan-editor"
rust-version = "1.98.0"
version = "0.0.0"

[workspace.dependencies]
thiserror = "=2.0.20"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
