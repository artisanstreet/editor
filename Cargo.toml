[workspace]
members = [
    "modules/assets",
    "modules/backend",
    "modules/database",
    "modules/domain",
    "modules/frontend",
    "modules/migrations",
    "modules/protocol",
    "modules/transport",
    "modules/ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/sandersonstabo/artisan-editor"
rust-version = "1.98.0"
version = "0.0.0"

[workspace.dependencies]
quinn = { version = "=0.11.11", default-features = false, features = [
    "runtime-tokio",
    "rustls-ring",
] }
rcgen = { version = "=0.14.9", default-features = false, features = [
    "crypto",
    "ring",
] }
rustls = { version = "=0.23.43", default-features = false, features = [
    "logging",
    "ring",
    "std",
] }
rustls-pki-types = "=1.15.1"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
