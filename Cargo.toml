[workspace]
members = [
    "crates/ae",
    "crates/artisan-account",
    "crates/artisan-api",
    "crates/artisan-markdown-index",
    "crates/artisan-paths",
    "crates/artisan-payload",
    "crates/artisan-mentions",
    "crates/claude-ai-browser",
    "crates/editor-aqua",
    "crates/editor-core",
    "crates/editor-ui",
    "crates/editor-sources",
    "crates/editor-composer",
    "crates/editor-conversation",
    "crates/editor-sidebar",
    "crates/editor-inspector",
    "crates/editor-settings",
    "crates/editor-marketplace",
    "crates/editor-assets",
    "crates/editor-audio",
    "crates/forge",
    "crates/forge-content",
    "crates/forge-computer",
    "crates/forge-engines",
    "crates/forge-http",
    "crates/forge-isolation",
    "crates/forge-mcp",
    "crates/forge-runs",
    "crates/forge-store",
]
exclude = [
    "vendor/highlighting/syntect",
    "vendor/highlighting/onig",
    "vendor/highlighting/validation",
    "vendor/mermaid-rs-renderer",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "BSD-3-Clause"
repository = "https://github.com/sandersonstabo/artisan-editor"
rust-version = "1.98.0"
version = "0.0.0"

[workspace.dependencies]
aqua = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-core = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-protocol = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-text = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-ui = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-reactive = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-runtime = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-media = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-gpu-d3d11 = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-gpu-ref = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-a11y-uia = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
aqua-ime-tsf = { git = "https://github.com/artisanstreet/aqua", rev = "817579f9c6d2d5e5f48315d2e916553eab369b56" }
ropey = "=1.6.1"
glam = "=0.34.1"
color = "=0.3.3"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
url = "=2.5.8"
regex = "=1.13.1"
data-url = "=0.3.2"
unicode-width = "=0.2.2"
vte = { version = "=0.15.0", default-features = false }
anyhow = "=1.0.104"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "http2", "json", "query", "tokio"] }
clap = { version = "=4.6.6", features = ["derive", "env"] }
dirs = "=5.0.1"
dhat = "=0.3.3"
ed25519-dalek = "=2.2.0"
flate2 = "=1.1.10"
insta = { version = "=1.49.0", features = ["json"] }
tokio-rustls = { version = "=0.26.4", default-features = false, features = ["ring", "logging", "tls12"] }
tokio-stream = { version = "=0.1.19", features = ["sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }
tower = { version = "=0.5.3", default-features = false }
tower-http = { version = "=0.6.11", default-features = false }
tracing = "=0.1.44"
base64 = { version = "=0.22.1", default-features = false, features = ["alloc"] }
cpal = { version = "=0.18.2", default-features = false }
fs2 = "=0.4.3"
futures = { version = "=0.3.34", default-features = false, features = ["executor", "std"] }
gethostname = "=1.1.0"
getrandom = { version = "=0.4.3", default-features = false }
hyper = { version = "=1.11.0", default-features = false, features = ["client", "http1"] }
hyper-util = { version = "=0.1.20", default-features = false, features = ["tokio"] }
ufbx = "=0.11.3"
stl_io = "=0.11.0"
ply-rs-bw = "=4.0.0"
gltf = { version = "=1.4.1", default-features = false, features = ["utils"] }
mermaid-rs-renderer = { version = "=0.3.1", default-features = false }
native-dialog = { version = "=0.9.7", default-features = false, features = [
    "windows_dpi_awareness",
] }
pulseaudio = "=0.3.1"
pulldown-cmark = { version = "=0.13.4", default-features = false }
rcgen = { version = "=0.14.9", default-features = false, features = [
    "crypto",
    "ring",
] }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls", "http2"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["env-filter", "fmt", "std", "tracing-log"] }
rustls = { version = "=0.23.43", default-features = false, features = [
    "logging",
    "ring",
    "std",
] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std", "rc"] }
serde_json = { version = "=1.0.151", features = ["preserve_order"] }
sse-core = { version = "=0.2.3", default-features = false, features = ["std", "stream"] }
rodio = { version = "=0.21.1", default-features = false, features = ["symphonia-all"] }
crossbeam-channel = "=0.5.15"
symphonia = { version = "=0.5.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
syntect = { version = "=5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-onig",
] }
image = { version = "=0.25.10", default-features = false }
webp = { version = "=0.3.1", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "=0.11.0"
hex = "=0.4.3"
similar = "=2.7.0"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "=1.1.4"
unicode-segmentation = "=1.13.3"
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
opt-level = 1
codegen-units = 16
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
debug = false

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
unwrap_in_result = "deny"
map_err_ignore = "deny"

[patch.crates-io]
syntect = { path = "vendor/highlighting/syntect" }
onig = { path = "vendor/highlighting/onig" }
