rodio = { version = "=0.21.1", default-features = false, features = ["symphonia-all"] }
crossbeam-channel = "=0.5.15"
symphonia = { version = "=0.5.5", default-features = false, features = [
    "aac",
    "flac",
    "isomp4",
    "mp3",
    "ogg",
    "pcm",
    "vorbis",
    "wav",
] }
syntect = { version = "=5.3.0", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-onig",
] }
image = { version = "=0.25.10", default-features = false }
webp = { version = "=0.3.1", default-features = false }
rusqlite = { version = "=0.39.0", features = ["bundled"] }
sha2 = "=0.11.0"
hex = "=0.4.3"
similar = "=2.7.0"
tar = "=0.4.46"
tempfile = "=3.27.0"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", default-features = false }
tokio-tungstenite = { version = "=0.30.0", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
toml = "=1.1.4"
unicode-segmentation = "=1.13.3"
uuid = { version = "=1.26.0", default-features = false, features = ["std", "v7"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] }

[workspace.lints.rust]
unsafe_code = "forbid"

# Two build modes: Debug (`dev`, the default, into target/debug) and Release
# (`release`, into target/release). Tests and benches inherit them.
#
# Debug: the development loop's build, so it trades runtime speed for build
# time. Dependencies (GPUI, wgpu, and the rest) build at opt-level 3: they are
# compiled once and cached, and an unoptimized GPUI Editor renders at a small
# fraction of its frame rate. The workspace's own crates, recompiled on every
# change, build at opt-level 1. Line tables only, everywhere: backtraces name
# file and line in every frame, and the Windows Editor stays small enough to
# copy and start quickly (full debug info made it 530 MB).
[profile.dev]
opt-level = 1
codegen-units = 16
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 3
# MinGW keeps DWARF inside the exe: dependency line tables made the dev
# Editor ~380 MB, ~260 MB of it debug sections. Our own crates keep theirs.
debug = false

# Release: every stable setting that trades build time for a faster, smaller
# binary. Speed wins where the two conflict, so opt-level 3 rather than "s" or
# "z". Whole-program (fat) LTO over one codegen unit lets LLVM inline and drop
# dead code across every crate, including GPUI and wgpu. Panics abort instead
# of unwinding, which also removes the unwind tables; the panic message still
# names file and line, but `catch_unwind` (the Mermaid guard in editor-ui)
# catches nothing. No debug info and no symbols. The CPU baseline (x86-64-v3)
# lives in .cargo/config.toml.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
strip = true

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
missing_errors_doc = "allow"
missing_panics_doc = "allow"
doc_markdown = "allow"
must_use_candidate = "allow"
# Restriction lints are picked one by one; the group as a whole contradicts
# itself.
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"
allow_attributes_without_reason = "deny"
undocumented_unsafe_blocks = "deny"
clone_on_ref_ptr = "deny"
rc_buffer = "deny"
str_to_string = "deny"
wildcard_enum_match_arm = "deny"
let_underscore_must_use = "deny"
missing_assert_message = "deny"
unwrap_in_result = "deny"
map_err_ignore = "deny"

[workspace.metadata.gpui-fork]
repository = "https://github.com/artisanstreet/gpui-ce"
branch = "main"
purpose = "native D3D11 renderer on Windows (WGPU elsewhere), backdrop blur materials, Oklab gradients, native color emoji"

# Bounded Oniguruma search with the original fancy engine as the limit fallback.
[patch.crates-io]
syntect = { path = "vendor/highlighting/syntect" }
onig = { path = "vendor/highlighting/onig" }
