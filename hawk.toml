preserve-uniform-field-visibility = true

[[production]]
package = "editor-aqua"
bin = "editor-aqua"
reason = "shipped Editor"

[[production]]
package = "forge"
bin = "forge"
reason = "shipped Forge"

[[production]]
package = "ae"
bin = "ae"
reason = "shipped CLI and installer"

[[feature-profile]]
name = "shipped"

[[feature-profile]]
name = "all"
all-features = true

[[exclude]]
crate = "editor_aqua"
module = "capture"
level = "expect"
target = "cfg(not(windows))"
reason = "capture tooling runs only on Windows; elsewhere its window and readback paths are compiled out, so its items look dead"

[[override]]
lint = "hawk::unnecessary_public"
crate = "forge_http"
item = "upgrade::Upgrade::binary"
kind = "field"
level = "expect"
target = "cfg(not(windows))"
reason = "the Windows build uses this item or compiles a different implementation of it"

[[override]]
lint = "hawk::unnecessary_public"
crate = "forge_isolation"
item = "linux::protect_forge"
kind = "function"
level = "expect"
target = "cfg(not(windows))"
reason = "Linux-only cgroup module, so the Windows run cannot confirm the finding"

[[override]]
lint = "hawk::unnecessary_restricted_visibility"
crate = "editor_audio"
item = "state::Inner::fill_mapped"
kind = "inherent_method"
