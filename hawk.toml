preserve-uniform-field-visibility = true

[[production]]
package = "editor-aqua"
bin = "editor-aqua"
reason = "shipped Editor"

[[production]]
package = "forge"
bin = "forge"
reason = "shipped Forge"

[[production]]
package = "ae"
bin = "ae"
reason = "shipped CLI and installer"

[[feature-profile]]
name = "shipped"

[[feature-profile]]
name = "all"
all-features = true

[[exclude]]
crate = "editor_aqua"
module = "capture"
level = "expect"
reason = "capture tooling only runs on Windows with the capture feature; elsewhere it compiles partially, so its findings are not comparable across targets"

