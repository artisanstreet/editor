<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
	<defs>
		<mask id="rising-cutout" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
			<rect x="-50" y="-50" width="200" height="200" fill="white" />
			<rect x="7.5" y="42" width="85" height="16" rx="3.5" fill="black" stroke="black" stroke-width="5.3125" transform="rotate(-30 50 50)" />
		</mask>
	</defs>
	<g fill="white">
		<g mask="url(#rising-cutout)">
			<rect x="7.5" y="42" width="85" height="16" rx="3.5" transform="rotate(90 50 50)" />
			<rect x="7.5" y="42" width="85" height="16" rx="3.5" transform="rotate(30 50 50)" />
		</g>
		<rect x="7.5" y="42" width="85" height="16" rx="3.5" transform="rotate(-30 50 50)" />
	</g>
</svg>
