# Artisan vendored SVG asset manifest - schema version 1.
#
# Generated during Phase 6 asset archaeology from verified sources; maintained
# as checked-in deterministic data (no generator ships in the repository).
#
# [[asset]] fields:
#   id              stable AssetId ("<family>.<name>"); unique across the table
#   family          artisan | brands | jetbrains | lobe | simple-icons | svgl | tabler
#   name            original name within the source family
#   origin_kind     package (pinned npm install) | local (checked-in legacy tree)
#   origin_package  npm package name (package origins only)
#   origin_version  pinned package version (package origins only)
#   origin_path     path within the package backing store or legacy repository
#   license_spdx    SPDX expression; LicenseRef-* marks recorded restrictions
#   license_file    path under modules/assets/licenses/
#   view_box        viewBox of the root svg element (empty when absent upstream)
#   monochrome      artwork paint derivation; see docs/ui/ASSETS.md section 10
#   source_path     normalized relative path under modules/assets/
#   sha256          SHA-256 over the exact raw checked-in SVG file bytes;
#                   modules/assets/.gitattributes pins svg/**/*.svg to LF so raw
#                   byte identity holds on every platform
#   notes           optional provenance/attribution detail
#
# [[use]] fields: id, channel, reachability, classification, sites (legacy paths),
# assets (linked asset ids). Classification vocabulary:
#   static-vendored | data-driven-native | renderer-deferred | shader-deferred | dormant.
# shader-deferred has zero instances: the census asserts no shader-dependent SVG
# effect exists in the legacy frontend (docs/ui/ASSETS.md section 5).

schema_version = 1

