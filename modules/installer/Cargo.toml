[package]
name = "ae-installer"
description = "Standalone cross-platform installer and manager for Artisan Editor"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "installer"
path = "rust/main.rs"

[dependencies]
artisan-build-info = { path = "../build_info" }
base64.workspace = true
chrono = { version = "=0.4.45", default-features = false, features = ["clock", "serde"] } # workspace-absent
clap = { version = "=4.6.6", features = ["derive", "env"] } # workspace-absent
ed25519-dalek = "=2.2.0" # workspace-absent
fs2.workspace = true
hex = "=0.4.3" # workspace-absent
reqwest = { version = "=0.12.28", default-features = false, features = [
	"rustls-tls",
	"http2",
	"stream",
] } # workspace-absent
serde = { version = "=1.0.229", features = ["derive"] } # workspace-absent
serde_json.workspace = true
semver = "=1.0.28" # workspace-absent
sha2.workspace = true
tar = "=0.4.46" # workspace-absent
tempfile = "=3.27.0" # workspace-absent
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "process", "rt-multi-thread"] }
url = { workspace = true, features = ["serde"] }
zip = { version = "=4.6.1", default-features = false, features = ["deflate"] } # workspace-absent
zstd = "=0.13.3" # workspace-absent

[target.'cfg(windows)'.dependencies]
winapi-util.workspace = true
winreg = "=0.55.0" # workspace-absent

[lints]
workspace = true
