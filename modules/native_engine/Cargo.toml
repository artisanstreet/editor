[package]
name = "artisan-native-engine"
description = "Certified native engine installation and profile authority"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
artisan-domain = { path = "../domain" }
base64.workspace = true
command-group.workspace = true
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] } # workspace-absent
fs2.workspace = true
getrandom.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] } # workspace-absent
serde = { version = "=1.0.229", features = ["derive"] } # workspace-absent
serde_json.workspace = true
sha2.workspace = true
tempfile = "=3.27.0" # workspace-absent
winapi-util.workspace = true

