[package]
name = "artisan-editor-cli"
description = "Permanent, cross-platform Artisan Editor command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ae"
path = "rust/main.rs"

[lib]
path = "rust/lib.rs"

[dependencies]
artisan-domain = { path = "../domain" }
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "0.4"
getrandom = "0.3"
processkit.workspace = true
rcgen.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
rustls.workspace = true
rustls-pki-types.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
winapi-util.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[[test]]
name = "native_engine_profile"
path = "../../tests/cli/native_engine_profile.rs"
