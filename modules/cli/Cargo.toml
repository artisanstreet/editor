[package]
name = "artisan-editor-cli"
description = "Permanent, cross-platform Artisan Editor command-line client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "ae"
path = "rust/main.rs"

[lib]
path = "rust/lib.rs"

[dependencies]
artisan-domain = { path = "../domain" }
artisan-native-engine = { path = "../native_engine" }
artisan-protocol = { path = "../protocol" }
artisan-transport = { path = "../transport" }
base64.workspace = true
clap = { version = "=4.6.6", features = ["derive", "env"] } # workspace-absent
flate2 = { version = "=1.1.10", default-features = false, features = ["rust_backend"] } # workspace-absent
fs2.workspace = true
getrandom.workspace = true
processkit.workspace = true
rcgen.workspace = true
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] } # workspace-absent
rustls.workspace = true
rustls-pki-types.workspace = true
serde = { version = "=1.0.229", features = ["derive"] } # workspace-absent
serde_json.workspace = true
sha2.workspace = true
tempfile = "=3.27.0" # workspace-absent
thiserror.workspace = true
tokio.workspace = true
winapi-util.workspace = true
x509-parser.workspace = true
zeroize.workspace = true

[lints]
workspace = true

[[test]]
name = "native_engine_profile"
path = "../../tests/cli/native_engine_profile.rs"

[[test]]
name = "cli_native_credentials"
path = "../../tests/cli/native_credentials.rs"

[[test]]
name = "cli_native_reconnect_capability"
path = "../../tests/cli/native_reconnect_capability.rs"

[[test]]
name = "cli_native_instance"
path = "../../tests/cli/native_instance.rs"

[[test]]
name = "cli_native_opencode2_authority"
path = "../../tests/cli/native_opencode2_authority.rs"

[[test]]
name = "cli_native_opencode2_install"
path = "../../tests/cli/native_opencode2_install.rs"

[[test]]
name = "cli_native_lifecycle"
path = "../../tests/cli/native_lifecycle.rs"
