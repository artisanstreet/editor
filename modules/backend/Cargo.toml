[package]
name = "artisan-backend"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
artisan-database = { path = "../database" }
artisan-domain = { path = "../domain" }
artisan-migrations = { path = "../migrations" }
artisan-native-engine = { path = "../native_engine" }
artisan-protocol = { path = "../protocol" }
artisan-transport = { path = "../transport" }
base64.workspace = true
bytes.workspace = true
