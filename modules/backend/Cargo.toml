[package]
name = "artisan-backend"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "forge"
path = "src/main.rs"

[dependencies]
artisan-catalog = { path = "../catalog" }
artisan-database = { path = "../database" }
artisan-domain = { path = "../domain" }
artisan-migrations = { path = "../migrations" }
artisan-native-engine = { path = "../native_engine" }
artisan-protocol = { path = "../protocol" }
artisan-transport = { path = "../transport" }
base64.workspace = true
bytes.workspace = true
fs2.workspace = true
getrandom.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp"] }
quinn.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
rustls-pki-types.workspace = true
sea-orm.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "macros", "net", "process", "rt", "signal", "sync", "time"] }
zeroize.workspace = true
command-group.workspace = true
tiktoken-rs = "0.12.0"

[target.'cfg(target_os = "windows")'.dependencies]
native-dialog.workspace = true
winapi-util.workspace = true

[dev-dependencies]
rcgen.workspace = true
sha2.workspace = true

