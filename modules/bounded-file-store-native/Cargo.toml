[package]
name = "bounded-file-store-native"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
build = "build.rs"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
napi = { version = "=3.10.3", features = ["napi9"] }
napi-derive = "=3.5.9"
hmac = { version = "=0.13.0", features = ["zeroize"] }
sha2 = "=0.11.0"
zeroize = "=1.9.0"
windows-sys = { version = "=0.61.2", features = [
	"Wdk_Foundation",
	"Wdk_Storage_FileSystem",
	"Win32_Foundation",
	"Win32_Security",
	"Win32_Security_Authorization",
	"Win32_Storage_FileSystem",
	"Win32_System_IO",
	"Win32_System_Threading",
	"Win32_System_WindowsProgramming",
] }

[build-dependencies]
napi-build = "=2.3.2"
