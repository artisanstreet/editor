[package]
name = "artisan-protocol"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
artisan-domain = { path = "../domain" }
capnp.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

# Root-level tests stay outside the crate directory; this registration keeps
# the protocol coverage indexed for rust-analyzer and focused cargo runs.
[[test]]
name = "phase1_proof"
path = "../../tests/protocol/phase1_proof.rs"

[[test]]
name = "assistant_message"
path = "../../tests/protocol/assistant_message.rs"

[[test]]
name = "owned_codec"
path = "../../tests/protocol/owned_codec.rs"

[[test]]
name = "product_roundtrip"
path = "../../tests/protocol/product_roundtrip.rs"

[[test]]
name = "engine_run_config"
path = "../../tests/protocol/engine_run_config.rs"

[lints]
workspace = true
