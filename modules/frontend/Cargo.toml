[package]
name = "artisan-frontend"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "editor"
path = "src/main.rs"

[features]
visual-proof = ["gpui_platform/test-support"]

[[example]]
name = "parity-visual-proof"
path = "examples/parity_visual_proof.rs"
required-features = ["visual-proof"]

[dependencies]
artisan-assets = { path = "../assets" }
artisan-build-info = { path = "../build_info" }
artisan-catalog = { path = "../catalog" }
artisan-domain = { path = "../domain" }
artisan-editor-cli = { path = "../cli" }
artisan-protocol = { path = "../protocol" }
artisan-transport = { path = "../transport" }
artisan-ui = { path = "../ui" }
base64.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
image = { version = "=0.25.10", default-features = false, features = ["gif", "jpeg", "png", "webp", "ico"] }
resvg = { version = "=0.48.1", default-features = false }
rustls-pki-types.workspace = true
serde_json.workspace = true
sha2.workspace = true
statig.workspace = true
thiserror.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
quinn.workspace = true
rcgen.workspace = true

