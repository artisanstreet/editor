<svg xmlns="http://www.w3.org/2000/svg" width="720" height="720" viewBox="0 0 720 720">
	<defs>
		<clipPath id="icon-shape">
			<rect x="18" y="18" width="684" height="684" rx="154" />
		</clipPath>
		<filter id="plastic-card" x="-25%" y="-25%" width="150%" height="165%" color-interpolation-filters="sRGB">
			<!-- Outer 0 1px 2px / 22%. -->
			<feGaussianBlur in="SourceAlpha" stdDeviation="3.054" result="outer-near-blur" />
			<feOffset in="outer-near-blur" dy="3.054" result="outer-near-offset" />
			<feFlood flood-color="black" flood-opacity="0.22" result="outer-near-color" />
			<feComposite in="outer-near-color" in2="outer-near-offset" operator="in" result="outer-near" />

			<!-- Outer 0 8px 16px -6px / 38%. -->
			<feMorphology in="SourceAlpha" operator="erode" radius="18.321" result="outer-mid-spread" />
			<feGaussianBlur in="outer-mid-spread" stdDeviation="24.429" result="outer-mid-blur" />
			<feOffset in="outer-mid-blur" dy="24.429" result="outer-mid-offset" />
			<feFlood flood-color="black" flood-opacity="0.38" result="outer-mid-color" />
			<feComposite in="outer-mid-color" in2="outer-mid-offset" operator="in" result="outer-mid" />

			<!-- Outer 0 22px 44px -18px / 48%. -->
			<feMorphology in="SourceAlpha" operator="erode" radius="54.964" result="outer-far-spread" />
			<feGaussianBlur in="outer-far-spread" stdDeviation="67.179" result="outer-far-blur" />
			<feOffset in="outer-far-blur" dy="67.179" result="outer-far-offset" />
			<feFlood flood-color="black" flood-opacity="0.48" result="outer-far-color" />
			<feComposite in="outer-far-color" in2="outer-far-offset" operator="in" result="outer-far" />

			<!-- The inverse alpha is the source for clipped inset shadows. -->
			<feFlood flood-color="white" result="filter-canvas" />
			<feComposite in="filter-canvas" in2="SourceAlpha" operator="out" result="outside" />

			<!-- Inset 0 10px 18px -10px white / 20%. -->
			<feMorphology in="outside" operator="erode" radius="30.536" result="top-soft-spread" />
			<feGaussianBlur in="top-soft-spread" stdDeviation="27.482" result="top-soft-blur" />
			<feOffset in="top-soft-blur" dy="30.536" result="top-soft-offset" />
			<feComposite in="top-soft-offset" in2="SourceAlpha" operator="in" result="top-soft-mask" />
			<feFlood flood-color="white" flood-opacity="0.2" result="top-soft-color" />
			<feComposite in="top-soft-color" in2="top-soft-mask" operator="in" result="top-soft" />

			<!-- Inset 0 -10px 18px -10px black / 38%. -->
			<feMorphology in="outside" operator="erode" radius="30.536" result="bottom-soft-spread" />
			<feGaussianBlur in="bottom-soft-spread" stdDeviation="27.482" result="bottom-soft-blur" />
			<feOffset in="bottom-soft-blur" dy="-30.536" result="bottom-soft-offset" />
			<feComposite in="bottom-soft-offset" in2="SourceAlpha" operator="in" result="bottom-soft-mask" />
			<feFlood flood-color="black" flood-opacity="0.38" result="bottom-soft-color" />
			<feComposite in="bottom-soft-color" in2="bottom-soft-mask" operator="in" result="bottom-soft" />

			<!-- The 1.5px top and bottom inset hairlines. -->
			<feOffset in="outside" dy="4.58" result="top-line-offset" />
			<feComposite in="top-line-offset" in2="SourceAlpha" operator="in" result="top-line-mask" />
			<feFlood flood-color="white" flood-opacity="0.2" result="top-line-color" />
			<feComposite in="top-line-color" in2="top-line-mask" operator="in" result="top-line" />
			<feOffset in="outside" dy="-4.58" result="bottom-line-offset" />
			<feComposite in="bottom-line-offset" in2="SourceAlpha" operator="in" result="bottom-line-mask" />
			<feFlood flood-color="black" flood-opacity="0.28" result="bottom-line-color" />
			<feComposite in="bottom-line-color" in2="bottom-line-mask" operator="in" result="bottom-line" />

			<feMerge>
				<feMergeNode in="outer-far" />
				<feMergeNode in="outer-mid" />
				<feMergeNode in="outer-near" />
				<feMergeNode in="SourceGraphic" />
				<feMergeNode in="top-soft" />
				<feMergeNode in="bottom-soft" />
				<feMergeNode in="top-line" />
				<feMergeNode in="bottom-line" />
			</feMerge>
		</filter>
		<mask id="star-rising-cutout" maskUnits="userSpaceOnUse" x="-50" y="-50" width="200" height="200">
			<rect x="-50" y="-50" width="200" height="200" fill="white" />
			<rect x="7.5" y="42" width="85" height="16" rx="3.5" fill="black" stroke="black" stroke-width="5.3125" transform="rotate(-30 50 50)" />
		</mask>
	</defs>
	<g filter="url(#plastic-card)">
		<g clip-path="url(#icon-shape)">
			<image x="18" y="18" width="684" height="684" href="data:image/svg+xml;base64," />
		</g>
	</g>
	<!-- Inset 0 0 0 0.5px white / 20%. -->
	<rect x="18.763" y="18.763" width="682.474" height="682.474" rx="153.237" fill="none" stroke="white" stroke-opacity="0.2" stroke-width="1.527" />
	<g fill="white" transform="translate(120 216.45) scale(3)">
		<path d="m149.6 8.4c-0.5-0.2-1.2-0.1-1.6-0.1h-87.3c-1 0-1.9 0.8-1.9 2v2.6h-11.9c-0.5-0.1-1.1 0.1-1 2.5-11.1-0.4-21.2-0.9-36.2-0.6-1.5 0.1-1.9 1.5-1 3 3.1 5.5 15.1 17.1 35.2 20.9 6.1 1.3 9.1 0.9 13.1 1.8 4.7 0.9 9.1 3.9 9.6 10.1s-3.3 15.1-17.3 19.9l-4.4 1.3c-1.6 0.5-2.6 1.8-2.6 3.6v9.3c0 1.1 0.8 2.7 2.4 2.7h20.2c0.9 0 1.5-0.2 1.9-0.4 3.4-1.4 8.7-3.5 17.1-3.5 10.2-0.1 15.7 2 18.5 3.3 1 0.6 1.6 0.6 2.3 0.6h19.2c1.8 0 2.3-1.3 2.3-2.5v-9.2c0-1.6-1-3.2-3.1-3.5-8.9-1.8-20.9-8.8-19.7-21.3 0.2-2 0.6-3.7 1.7-6 3.8-8 13.3-14.9 21.5-18.3 10-4.2 17.3-5.8 22.3-6.5 2.2-0.1 2.9-1.5 2.9-2.9v-6.5c0-1.3-0.7-2.1-1.6-2.4z" />
	</g>
</svg>
