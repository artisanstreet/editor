[package]
name = "artisan-database"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
artisan-domain = { path = "../domain" }
sea-orm.workspace = true
# Crate Universe resolves SQLx's target-specific `sqlx-core/offline` edge on
# Windows. Enabling the driver's paired feature keeps its `Executor` impl and
# optional serde edge coherent in the Bazel graph.
sqlx-sqlite.workspace = true
subtle.workspace = true
thiserror.workspace = true
zeroize.workspace = true

[dev-dependencies]
artisan-migrations = { path = "../migrations" }
tokio = { workspace = true, features = ["macros", "rt"] }

