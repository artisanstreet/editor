appId: com.usebarekey.artisan-editor
productName: Artisan Editor
directories:
    app: .dist/desktop
    output: .dist/electron-release
electronDist: node_modules/electron/dist
files:
    - main.js
    - package.json
    - frontend/**
asar: true
beforeBuild: .scripts/build/electron-before-build.ts
disableDefaultIgnoredFiles: true
extraMetadata:
    main: main.js
protocols:
    - name: Artisan Forge
      schemes:
          - artisan
win:
    target:
        - dir
