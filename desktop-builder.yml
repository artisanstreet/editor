appId: com.usebarekey.artisan-editor
productName: Artisan Editor
directories:
    output: .dist/electron-release
files:
    - from: .dist/desktop
      to: .dist/desktop
    - from: .dist/frontend
      to: .dist/frontend
    - from: modules/backend/drizzle
      to: modules/backend/drizzle
    - package.json
    - node_modules/**/*
asar: true
asarUnpack:
    - "**/*.node"
    - "**/node-pty/**"
    - "**/@artisan/bounded-file-store-native/**"
extraMetadata:
    main: .dist/desktop/main.js
win:
    target:
        - nsis
