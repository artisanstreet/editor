appId: com.usebarekey.artisan-editor
productName: Artisan Editor
directories:
    output: .dist/electron-release
files:
    - from: .dist/desktop
      to: .dist/desktop
    - from: .dist/frontend
      to: .dist/frontend
    - from: modules/backend/drizzle
      to: modules/backend/drizzle
    - package.json
asar: true
disableDefaultIgnoredFiles: true
asarUnpack:
    - "**/*.node"
    - "**/native-runtime/**"
extraMetadata:
    main: .dist/desktop/main.js
win:
    target:
        - nsis
