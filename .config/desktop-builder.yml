appId: com.usebarekey.artisan-editor
productName: Artisan Editor
directories:
    app: .dist/desktop
    buildResources: modules/frontend/src/lib/assets/barekey
    output: .dist/electron-release
electronDist: node_modules/electron/dist
# Artisan's product copy and hidden native menu are English-only today. Shipping
# every Chromium locale adds roughly 47 MiB to the unpacked editor without
# changing renderer capability; add locales here when product localization lands.
electronLanguages: en-US
files:
    - main.js
    - package.json
    - frontend/**
asar: true
beforeBuild: .scripts/build/electron-before-build.ts
disableDefaultIgnoredFiles: true
extraMetadata:
    main: main.js
protocols:
    - name: Artisan Forge
      schemes:
          - artisan
win:
    # electron-builder rasterizes the existing 720px Artisan/Barekey SVG into
    # the multi-resolution Windows ICO resource during packaging.
    icon: logo-gradient.svg
    target:
        - dir
